/* 分段控件滑动指示块：跟随选中的按钮平滑移动 */
function segThumb(seg){
  if(!seg) return;
  let thumb = seg.querySelector(".thumb");
  if(!thumb){ thumb = document.createElement("span"); thumb.className = "thumb"; seg.appendChild(thumb); }
  const on = seg.querySelector("button.on") || seg.querySelector("button");
  if(!on){ thumb.style.opacity = "0"; return; }
  thumb.style.opacity = "1";
  thumb.style.left = on.offsetLeft + "px";
  thumb.style.width = on.offsetWidth + "px";
}
function initSegs(){
  document.querySelectorAll(".seg").forEach(seg => {
    segThumb(seg);
    if(!seg.dataset.thumbBound){
      seg.dataset.thumbBound = "1";
      seg.addEventListener("click", e => { if(e.target.closest("button")) requestAnimationFrame(()=>segThumb(seg)); });
    }
  });
}
window.addEventListener("resize", ()=> initSegs());

const NAV_GROUPS = [["网关",0,4],["数据",4,6],["系统",6,8]];
function nav(){
  let html = "";
  for(const [title, from, to] of NAV_GROUPS){
    html += `<div class="grp grp-txt">${title}</div>`;
    html += PAGES.slice(from,to).map(([id,label,ic])=>
      `<button data-p="${id}" title="${label}" aria-label="${label}" aria-current="${id===cur?"page":"false"}" class="${id===cur?"on":""}">${icon(ic)}<span class="lbl">${label}</span></button>`).join("");
  }
  $("#nav").innerHTML = html;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{ cur=b.dataset.p; localStorage.setItem("zengate.page",cur); nav(); render(); logTimer = syncLogTimer(logTimer); });

  // 侧栏伸缩（记忆状态）
  const side = document.getElementById("side");
  const applySide = () => {
    const collapsed = localStorage.getItem("zengate.side") === "collapsed";
    side.classList.toggle("collapsed", collapsed);
    document.getElementById("side-toggle").innerHTML =
      (collapsed ? icon("chevRight") : icon("chevLeft")) + '<span class="lbl">收起侧栏</span>';
  };
  document.getElementById("side-toggle").onclick = () => {
    localStorage.setItem("zengate.side",
      side.classList.contains("collapsed") ? "open" : "collapsed");
    applySide();
  };
  applySide();
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on", p.id==="page-"+cur));
}

function skeleton(){
  if(STATE) return;
  const el = document.getElementById("page-"+cur);
  if(!el) return;
  el.innerHTML = `<div class="skel">
    <div class="sk-head"><i style="width:150px;height:22px"></i><i style="width:110px;height:11px"></i></div>
    <div class="sk-kpis">${"<div class=\"sk-kpi\"><i></i><i></i></div>".repeat(5)}</div>
    <div class="sk-panel"><i></i><i></i><i></i><i></i></div>
    <div class="sk-cols">${"<div class=\"sk-panel\"><i></i><i></i><i></i></div>".repeat(2)}</div>
    <div class="sk-cards">${"<div class=\"sk-panel\"><i></i><i></i></div>".repeat(4)}</div>
  </div>`;
}

function render(){ if(!STATE){ skeleton(); return; } const s=STATE;
  $("#svcdot").className = "dot";
  $("#svcstat").textContent = "运行中";
  const todayKey0 = Object.keys(s.stats.days||{}).sort().pop();
  $("#side-today").textContent = fmtN(todayKey0 ? (s.stats.days[todayKey0].output||0) : 0);
  // Only the free lane is probed on a timer; a custom provider's models are
  // tested on demand, so counting them here would cap the ratio below 100%.
  const lane = s.models.filter(m=>!m.custom);
  $("#side-models").textContent = lane.filter(m=>m.state==="available").length + "/" + lane.length;
  $("#side-ver").textContent = s.version || "";
  $("#egress-foot").textContent = s.egress&&s.egress.ip ? `${s.egress.ip} (${s.egress.country||"?"})` : "出口未知";
  renderDash(s); renderAgents(s); renderModels(s); renderProviders(s); renderAccess(s); renderUsage(s); renderSettings(s);
  // 分段控件的滑块要靠 JS 量宽度才就位：登录版本在「自定义 API」页、热力度模式在概览页，
  // 以前只有日志/设置页会调它，别的页面上的 seg 就一直顶着 40px 的默认滑块。
  initSegs();
  if (cur === "logs") renderLogs();
  logTimer = syncLogTimer(logTimer);
  renderDashExtras(s);
}

/* ---- 总览 ---- */
function renderDash(s){
  const laneModels = s.models.filter(m=>!m.custom);
  const avail = laneModels.filter(m=>m.state==="available" && !m.hidden).length;
  const on = s.agents.filter(a=>a.enabled).length;
  const todayKey = Object.keys(s.stats.days||{}).sort().pop();
  const day = todayKey ? s.stats.days[todayKey] : null;
  // 一键更新 only exists where the binary can replace itself in place; other
  // builds (the macOS .app) just link to the release page.
  const updAct = s.settings.updateSelfUpdate ? `<button class="act" id="upd-apply">一键更新</button>` : "";
  const banner = s.settings.updateAvailable ? `
    <div class="card updbar">
      <span class="txt">发现新版本 <b>${esc(s.settings.updateVersion)}</b>（当前 ${esc(s.version)}）</span>
      <span class="acts">${updAct}<a href="${esc(safeHref(s.settings.updateURL))}" target="_blank">发布页 →</a></span>
    </div>` : "";
  // 公告卡常驻总览：critical/warn/info 分级着色，未读高亮 + 可标记已读；
  // 卡片只显示最新 2 条，「过往公告」弹窗里看全部（含已结束归档）。
  const anns = s.announcements || [];
  const annArch = s.announcementArchive || [];
  const annItem = (a, ended, compact = true) => {
    const lv = {critical:"var(--bad)",warn:"var(--warn)",info:"var(--accent)"}[a.level]||"var(--accent)";
    const unread = !!a.unread && !ended;
    // 长正文默认折三行，给一个展开入口，避免整页变成公告墙。
    const clamped = compact && !!a.body && a.body.length > 120;
    const open = annOpen.has(a.id);
    return `<div class="annitem${unread?" unread":""}${ended?" ended":""}${clamped&&!open?" clamp":""}${open?" open":""}" style="--lv:${lv}">
      <div class="ann-head">
        <span class="ann-title">${esc(a.title)}</span>
        ${a.level==="critical"?'<span class="pill bad">重要</span>':a.level==="warn"?'<span class="pill warn">注意</span>':""}
        ${ended?'<span class="pill hidsync">已结束</span>':""}
        ${a.start?`<span class="ann-date">${esc(a.start)}${a.end?" ~ "+esc(a.end):""}</span>`:""}
        <span class="ann-acts">
          ${clamped?`<button class="linkbtn ann-more" data-id="${esc(a.id)}">${open?"收起":"展开全文"}</button>`:""}
          ${a.url?`<a class="ann-link" href="${esc(safeHref(a.url))}" target="_blank">详情 →</a>`:""}
          ${unread?`<button class="ghost ann-read" data-id="${esc(a.id)}">知道了</button>`:""}
        </span>
      </div>
      ${a.body?`<div class="ann-body">${esc(a.body)}</div>`:""}
    </div>`;
  };
  const annHtml = `
    <div class="card">
      <div class="ann-hd">
        <h3 style="margin:0">公告 <span class="muted" style="font-size:11px; font-weight:400">${anns.length?anns.length+" 条生效中":"暂无生效中的公告"}</span></h3>
        <span class="row" style="gap:10px; flex-wrap:nowrap">
          <button class="ghost" id="ann-refresh" style="padding:2px 10px; font-size:11.5px">刷新</button>
          <span class="muted" style="font-size:11px">每 6 小时同步</span>
        </span>
      </div>
      ${anns.length ? anns.slice(0,2).map(a=>annItem(a,false)).join("") : `<div class="muted" style="font-size:12px">暂无公告——作者发布后这里会自动出现（每 6 小时同步，或点「刷新」立即拉取）。</div>`}
      ${(anns.length>2||annArch.length) ? `<div style="margin-top:10px"><button class="ghost" id="ann-history" style="padding:2px 10px; font-size:11.5px">过往公告（共 ${anns.length+annArch.length} 条）</button></div>` : ""}
    </div>`;
  const fail = day ? day.failed : 0;
  const failPill = fail > 0 ? ` <span class="pill bad">${fail} 失败</span>` : "";

  $("#page-dash").innerHTML = `
    <h2 class="pt">总览 <span class="sub">本地免费模型网关 v${esc(s.version)}</span></h2>${banner}

    <div class="sumstrip">
      <div class="cell" title="免费车道实测可用 / 免费车道总数；自定义供应商的模型只在点「测试」时实测，不计入这里"><div class="v">${avail}/${laneModels.length}</div><div class="l">模型可用</div></div>
      <div class="cell"><div class="v">${on}/${s.agents.filter(a=>a.installed).length}</div><div class="l">Agent 已开启</div></div>
      <div class="cell"><div class="v">${fmtN(day?day.output:0)}</div><div class="l">今日输出 tokens</div></div>
      <div class="cell"><div class="v">${fmtN(day?day.requests:0)}</div><div class="l">今日请求${failPill}</div></div>
      <div class="cell"><div class="v">${fmtN(day?(day.input||0)+(day.output||0):0)}</div><div class="l">今日总 Token</div></div>
    </div>

    ${annHtml}

    <div class="two">
      <div>
        <div class="card">
          <h3>服务</h3>
          <div class="row svcrow">
            <span class="kvp"><span class="dim">Base URL</span><code class="k">${s.baseURL}</code>
              <button class="ghost" data-copy="${s.baseURL}">复制</button></span>
            <span class="kvp"><span class="dim">主 Key</span><code class="k">${s.mainKey.slice(0,14)}…</code>
              <button class="ghost" data-copy="${s.mainKey}">复制</button></span>
          </div>
          <div class="row" style="margin-top:10px"><span class="muted" style="font-size:12px">
            OpenAI 兼容 <code class="k">/v1/chat/completions</code> <code class="k">/v1/responses</code> ·
            Anthropic 兼容 <code class="k">/v1/messages</code> · ${s.lanBaseURL ? "本机 + 局域网（需 API Key）" : "只监听 127.0.0.1"}</span></div>
          ${s.lanBaseURL ? `<div class="row" style="margin-top:8px"><span class="dim">局域网 Base URL</span><code class="k">${s.lanBaseURL}</code>
            <button class="ghost" data-copy="${s.lanBaseURL}">复制</button></div>` : ""}
          <div class="row" style="margin-top:10px">
            <button class="ghost" id="dash-copy-full">复制完整接入配置</button>
            <button class="ghost" id="dash-reprobe">重新探测</button>
            <button class="ghost" id="dash-gologs">查看日志</button>
          </div>
        </div>
        <div class="card">
          <h3>下一步 <span class="muted" style="font-size:11.5px; font-weight:400">按顺序走完，网关就算完全上手</span></h3>
          <div id="dash-tasks"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <h3>Agent 概览 <span class="muted" style="font-size:11px">开关可在这里直接切换</span></h3>
          <div id="dash-agents"></div>
        </div>
        <div class="card">
          <h3>今日模型用量</h3>
          <div id="dash-today"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>系统信息</h3>
      <div class="sysinfo">
        <div class="kv"><span class="k">版本</span><span class="v mono">${esc(s.version)}</span></div>
        <div class="kv"><span class="k">已运行</span><span class="v" id="uptime-val">${s.uptimeSec!=null ? fmtUptime(s.uptimeSec) : esc(s.uptime)}</span></div>
        <div class="kv"><span class="k">数据目录</span><span class="v mono" style="font-size:11px">${esc(s.dataDir)}</span></div>
        <div class="kv"><span class="k">出口</span><span class="v mono">${esc(s.egress&&s.egress.ip ? s.egress.ip+" ("+(s.egress.country||"?")+")" : "未知")}</span></div>
        <div class="kv"><span class="k">代理</span><span class="v">${esc(proxyLabel(s.settings.proxyMode, s.settings.proxyURL))}</span></div>
        <div class="kv"><span class="k">托盘 / 通知</span><span class="v">${s.settings.closeToTray?"开":"关"} / ${s.settings.notifications?"开":"关"}</span></div>
      </div>
    </div>`;

  // 下一步任务工作台：状态从真实数据推导，做完自动打勾。
  const agentsOn = s.agents.filter(a=>a.enabled).length;
  const anyReq = Object.values(s.stats.days||{}).some(d=>(d.requests||0)>0);
  const copied = localStorage.getItem("zengate.onboard-copy")==="1";
  const defSet = !!s.settings.defaultModel;
  const go = (page)=>()=>{ cur=page; localStorage.setItem("zengate.page",page); nav(); render(); };
  const tasks = [
    {ok: agentsOn>0, name:"开启一个 Agent", desc: agentsOn>0?`已开启 ${agentsOn} 个`:"到「Agent 适配」打开开关，重启对应 Agent", btn:"去开启", act: agentsOn>0?null:go("agents")},
    {ok: defSet, name:"选定主用模型", desc: defSet?`主用：${s.settings.defaultModel}`:"模型页点「设为主用」，一步到位", btn:"去挑选", act: defSet?null:go("models")},
    {ok: copied, name:"复制接入配置", desc:"Base URL + 主 Key，给任何 OpenAI/Anthropic 客户端", btn:"复制", act: null, copy:true},
    {ok: anyReq, name:"发出第一个请求", desc: anyReq?"已有真实调用记录":"在任意 Agent 里问一句话即完成", btn: anyReq?null:"看模型", act: anyReq?null:go("models")},
  ];
  const taskBox = document.getElementById("dash-tasks");
  if(taskBox){
    taskBox.innerHTML = tasks.map((t,i)=>`
      <div class="task${t.ok?" done":""}">
        <span class="t-dot">${t.ok?"✓":i+1}</span>
        <span><div class="t-name">${esc(t.name)}</div><div class="t-desc">${esc(t.desc)}</div></span>
        ${!t.ok&&t.btn?`<button class="ghost t-go" data-task="${i}">${t.btn}</button>`:""}
      </div>`).join("");
    taskBox.querySelectorAll("[data-task]").forEach(b=>{
      const t = tasks[+b.dataset.task];
      b.onclick = ()=>{
        if(t.copy){
          const text = JSON.stringify({baseURL: s.baseURL, apiKey: s.mainKey, models: s.models.map(m=>m.id)}, null, 2);
          navigator.clipboard.writeText(text).then(()=>{
            localStorage.setItem("zengate.onboard-copy","1");
            toast("已复制完整接入配置，这一步完成"); refresh();
          }).catch(()=>toast("复制失败"));
          return;
        }
        if(t.act) t.act();
      };
    });
  }
  // 快捷按钮
  document.getElementById("dash-copy-full").onclick = () => {
    const text = JSON.stringify({baseURL: s.baseURL, apiKey: s.mainKey, models: s.models.map(m=>m.id)}, null, 2);
    navigator.clipboard.writeText(text).then(()=>{
      localStorage.setItem("zengate.onboard-copy","1");
      toast("已复制完整接入配置");
    }).catch(()=>toast("复制失败"));
  };
  document.getElementById("dash-reprobe").onclick = async ()=>{
    const b = document.getElementById("dash-reprobe");
    await withButtonBusy(b, "探测中…", async()=>{ toast("探测中，稍后刷新…"); await api("/reprobe", {}); setTimeout(refresh, 1200); });
  };
  document.getElementById("dash-gologs").onclick = ()=>{ cur="logs"; localStorage.setItem("zengate.page","logs"); nav(); render(); };
  document.querySelectorAll(".ann-read").forEach(b=>{
    b.onclick = async ()=>{
      const j = await api("/announcements/read", { id: b.dataset.id });
      if(j) toast("已标记已读");
      refresh();
    };
  });
  document.querySelectorAll("#page-dash .ann-more").forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.id;
      annOpen.has(id) ? annOpen.delete(id) : annOpen.add(id);
      const on = annOpen.has(id);
      const it = b.closest(".annitem");
      it.classList.toggle("open", on);
      it.classList.toggle("clamp", !on);
      b.textContent = on ? "收起" : "展开全文";
    };
  });
  const annRefresh = document.getElementById("ann-refresh");
  if (annRefresh) annRefresh.onclick = async ()=>{
    await withButtonBusy(annRefresh, "刷新中…", async()=>{
      await api("/announcements/refresh", {});
      toast("拉取中，几秒后刷新…");
      setTimeout(refresh, 3000);
    });
  };
  // 过往公告弹窗：生效中 + 已结束全量列出；已读标记后关弹窗刷新卡片。
  const openAnnHistory = () => {
    document.getElementById("ann-history-modal")?.remove();
    const ov = document.createElement("div");
    ov.id = "ann-history-modal";
    ov.style.cssText = "position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px";
    ov.innerHTML = `
      <div style="background:var(--panel); border:1px solid var(--hairline); border-radius:12px; width:640px; max-width:100%; max-height:82vh; display:flex; flex-direction:column; box-shadow:0 18px 50px rgba(0,0,0,.35)">
        <div class="row" style="justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--hairline)">
          <h3 style="margin:0">过往公告 <span class="muted" style="font-size:11px">共 ${anns.length+annArch.length} 条</span></h3>
          <button class="ghost annhist-close" style="padding:2px 10px">关闭</button>
        </div>
        <div style="padding:12px 16px; overflow:auto">
          ${anns.length? `<div class="muted" style="font-size:11px; margin:2px 0 6px">生效中</div>` + anns.map(a=>annItem(a,false,false)).join("") : `<div class="muted" style="font-size:12px">暂无生效中的公告。</div>`}
          ${annArch.length? `<div class="muted" style="font-size:11px; margin:12px 0 6px">已结束</div>` + annArch.map(a=>annItem(a,true,false)).join("") : ""}
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.addEventListener("click", e=>{ if(e.target===ov) ov.remove(); });
    ov.querySelector(".annhist-close").onclick = ()=> ov.remove();
    ov.querySelectorAll(".ann-read").forEach(b=>{
      b.onclick = async ()=>{
        const j = await api("/announcements/read", { id: b.dataset.id });
        if(j) toast("已标记已读");
        ov.remove();
        refresh();
      };
    });
  };
  const annHistory = document.getElementById("ann-history");
  if (annHistory) annHistory.onclick = openAnnHistory;
}

function renderDashExtras(s){
  const todayKey = Object.keys(s.stats.days||{}).sort().pop();
  const day = todayKey ? s.stats.days[todayKey] : null;
  const agBox = document.getElementById("dash-agents");
  if (agBox){
    const installed = s.agents.filter(a=>a.installed);
    if(!installed.length){ agBox.innerHTML = `<div class="muted" style="font-size:12px">未检测到已支持的 Agent。</div>`; }
    else {
      agBox.innerHTML = installed.map(a=>`
        <div class="switch" style="padding:7px 0">
          <div><span class="nm" style="font-size:13px">${esc(a.name)}</span>
            ${a.enabled?`<span class="pill ok">已开启</span>`:`<span class="pill unknown">未开启</span>`}</div>
          <button class="ghost" data-dash-agent="${a.id}" data-enabled="${a.enabled?1:0}" style="padding:4px 12px;font-size:12px">
            ${a.enabled?"关闭":"开启"}</button>
        </div>`).join("");
      agBox.querySelectorAll("[data-dash-agent]").forEach(b=>{
        b.onclick = async ()=>{
          b.disabled = true;
          const j = await api(`/agent/${b.dataset.dashAgent}/${b.dataset.enabled==="1"?"disable":"enable"}`);
          if(j) toast("已切换，重启对应 Agent 后生效");
          refresh();
        };
      });
    }
  }
  const tBox = document.getElementById("dash-today");
  if (tBox){
    const models = day ? Object.entries(day.models||{}).sort((a,b)=>b[1]-a[1]) : [];
    if(!models.length){ tBox.innerHTML = `<div class="muted" style="font-size:12px">今天还没有用量——去任意 Agent 里发一条消息试试。</div>`; }
    else {
      const peak = models[0][1] || 1;
      tBox.innerHTML = `<table>` + models.map(([m,o])=>`
        <tr><td class="mono" style="font-size:11.5px">${esc(m)}</td>
        <td style="width:38%"><div class="barwrap"><div class="bar" style="width:${Math.round(o/peak*100)}%"></div></div></td>
        <td class="num">${fmtN(o)}</td></tr>`).join("") + `</table>
        <div class="muted" style="font-size:11.5px;margin-top:6px">${day.requests} 次请求 · 失败 ${day.failed} · 输出 ${fmtN(day.output)} tokens</div>`;
    }
  }
}

/* ---- Agent 适配 ---- */
function renderAgents(s){
  const el = $("#page-agents");
  el.innerHTML = `<h2 class="pt">Agent 适配 <span class="sub">开启后对应 Agent 的模型选择器出现免费模型；配置文件先备份，关闭即还原</span></h2>
    <div class="agrid" id="agent-list"></div>`;
  const box = el.querySelector("#agent-list");
  for(const a of s.agents){
    const d = document.createElement("div");
    d.className = "acard" + (a.enabled?" st-on":"") + (!a.installed?" st-noinst":"");
    const lg = BRAND_LOGOS[a.id];
    d.innerHTML = `
      <div class="ahead">
        <div class="aicon${lg?(lg.wide?" lg-wide":"")+(lg.neutral?" lg-neutral":""):""}">${lg?lg.svg:icon(AGENT_ICONS[a.id]||"agents")}</div>
        <div class="att">
          <div class="aname">${esc(a.name)}</div>
          ${a.version?`<div class="aver">${esc(a.version)}</div>`:""}
        </div>
      </div>
      <div class="ads">${esc(a.detail||"")}</div>
      ${a.warn?`<div class="warnline">⚠ ${esc(a.warn)}</div>`:""}
      <div class="afoot">
        ${a.enabled?`<span class="pill ok">已开启</span>`:(a.installed?`<span class="pill unknown">未开启</span>`:`<span></span>`)}
        <button class="tgl${a.enabled?" on":""}" role="switch" aria-checked="${a.enabled?"true":"false"}"
          title="${a.installed?(a.enabled?"关闭":"开启"):("未检测到 "+esc(a.name))}"></button>
      </div>`;
    const btn = d.querySelector(".tgl");
    btn.disabled = !a.installed;
    btn.onclick = async ()=>{
      btn.disabled = true;
      const j = await api(`/agent/${a.id}/${a.enabled?"disable":"enable"}`);
      if(j){ toast(a.enabled?"已关闭，配置已还原":"已开启，重启对应 Agent 后生效"); refresh(); }
      else { btn.disabled = false; }
    };
    box.appendChild(d);
  }
}

/* ---- 模型 ---- */
const STATE_ORDER = { available:0, custom:1, unknown:2, throttled:3, "region-blocked":4, unavailable:5 };

/* 探测进度：状态存在服务端的任务登记处，所以 10s 网格重建不会把进度擦掉。 */
let fastPollTimer = 0, tickTimer = 0, drawerFor = "", drawerTimer = 0;

function fmtMs(ms){
  if(ms >= 60000) return Math.floor(ms/60000) + "分" + String(Math.round(ms%60000/1000)).padStart(2,"0") + "秒";
  return ms >= 1000 ? (ms/1000).toFixed(1) + "s" : Math.round(ms) + "ms";
}
function fmtClock(ms){ return ms ? new Date(ms).toTimeString().slice(0,8) : ""; }
const TP_MARK = { running:"…", ok:"✓", fail:"✕", unknown:"·" };
const TP_CLASS = { running:"run", ok:"ok", fail:"fail", unknown:"unknown" };
function taskKindLabel(kind){ return kind === "caps" ? "能力实测" : "可用性测试"; }
// 一个模态会先报「开始」再报「结论」，卡片上只显示最新的那一步。
function lastPhases(steps){
  const by = new Map();
  for(const st of (steps||[])) by.set(st.name, st);
  return [...by.values()];
}
function taskBand(m){
  const t = m.task;
  if(!t) return "";
  const running = t.status === "running";
  const when = running
    ? `已用时 <b class="elapsed" data-start="${t.started}">…</b>`
    : (t.status === "failed" ? "已中止 · " : "完成 · ") + fmtClock(t.updated);
  const phases = lastPhases(t.steps).map(st=>{
    const cls = TP_CLASS[st.status] || "unknown";
    return `<span class="tp ${cls}" title="${esc(st.detail||"")}">${esc(st.name)} ${TP_MARK[st.status]||"·"}`
      + (st.ms?` <b>${fmtMs(st.ms)}</b>`:"") + `</span>`;
  }).join("");
  return `<div class="mtask"><div class="th"><span>${taskKindLabel(t.kind)}</span>`
    + `<span class="grow">${when}</span>`
    + `<button class="ghost tdet" data-m="${esc(m.id)}" title="展开这次探测的阶段明细">详情</button></div>`
    + `<div class="tps">${phases}</div></div>`;
}
function startTaskTicker(){
  if(!document.querySelector("#page-models .elapsed")){
    if(tickTimer){ clearInterval(tickTimer); tickTimer = 0; }
    return;
  }
  const paint = ()=>{
    const now = Date.now();
    document.querySelectorAll("#page-models .elapsed").forEach(e=>{
      e.textContent = fmtMs(Math.max(0, now - Number(e.dataset.start)));
    });
  };
  paint();
  if(!tickTimer) tickTimer = setInterval(paint, 250);
}

function drawerRows(runs){
  if(!runs.length) return `<div class="empty">这个模型还没有测试记录。点卡片上的「测试」或「能力实测」就会出现进度。</div>`;
  return runs.map(t=>{
    const st = t.status === "running" ? "进行中" : (t.status === "failed" ? "已中止" : "已完成");
    // 同一阶段会有「开始」和「结果」两行，抽屉里只留最后一条状态，否则每个模态重复一次。
    const rows = lastPhases(t.steps).map(s=>{
      const detail = s.detail
        ? `<span class="${s.status==="fail"||s.status==="unknown" ? "err" : "out"}">${esc(s.detail)}</span>` : "";
      return `<div class="row"><span class="tm">${fmtClock(s.at)}</span>`
        + `<span class="nm">${esc(s.name)} ${TP_MARK[s.status]||"·"}</span>`
        + `<span class="ms">${s.ms?fmtMs(s.ms):""}</span>${detail}</div>`;
    }).join("");
    return `<div class="run"><div class="rh"><b>${taskKindLabel(t.kind)}</b><span>${st}</span>`
      + `<span>开始 ${fmtClock(t.started)}</span></div>${rows}</div>`;
  }).join("");
}
async function paintDrawer(){
  if(!drawerFor) return;
  const box = document.getElementById("tdrawer");
  if(!box) return;
  const j = await fetch("/admin/api/tasks?model=" + encodeURIComponent(drawerFor)).then(r=>r.json()).catch(()=>null);
  if(!drawerFor || !document.getElementById("tdrawer")) return;
  const runs = (j && j.runs) || [];
  box.querySelector(".bd").innerHTML = drawerRows(runs);
  clearTimeout(drawerTimer);
  if(runs.some(t=>t.status === "running")) drawerTimer = setTimeout(paintDrawer, 1000);
}
function closeTaskDrawer(){
  drawerFor = "";
  clearTimeout(drawerTimer);
  document.getElementById("tdrawer")?.remove();
  document.getElementById("tdmask")?.remove();
}
async function openTaskDrawer(model){
  closeTaskDrawer();
  drawerFor = model;
  const mask = document.createElement("div");
  mask.id = "tdmask";
  mask.style.cssText = "position:fixed; inset:0; z-index:79; background:rgba(0,0,0,.45)";
  mask.onclick = closeTaskDrawer;
  const box = document.createElement("div");
  box.id = "tdrawer";
  box.innerHTML = `<div class="hd"><span class="t">${esc(model)}</span>`
    + `<button class="ghost" id="tdclose">关闭 ✕</button></div><div class="bd"></div>`;
  document.body.appendChild(mask);
  document.body.appendChild(box);
  box.querySelector("#tdclose").onclick = closeTaskDrawer;
  await paintDrawer();
}
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && drawerFor) closeTaskDrawer(); });

// 已展开的说明卡（key = 模型id+blurb前缀）：10s 轮询重渲染不塌回。

const CHAN_META = {
  zen:       { name: "OpenCode Zen 车道", desc: "免登录免费池，按出口 IP 限额" },
  kilo:      { name: "Kilo 免费池",       desc: "免凭证，在列即可用" },

  codearts:  { name: "CodeArts 账号渠道",  desc: "华为账号，含轮换福利模型" },

};

// 上游原始错误 → 一句人话；原文收进 title，不再把 JSON 印在卡片上。
function humanDetail(m){
  const d = String(m.detail || "");
  if(!d) return "";
  const map = [
    [/FreeUsageLimitError/i, "本出口的免费额度已用完，等限额窗口刷新或换出口再试"],
    [/FreeTierError/i,       "上游客户端门拦下了这次请求"],
    [/RegionError/i,         "当前出口被上游地区门拦下（海外出口可用）"],
    [/实时限额（等待恢复）/,   "暂时限流，等它恢复或手动重测"],
    [/在列（免费池名单即判定）/, ""],
  ];
  for(const [re, msg] of map) if(re.test(d)) return msg;
  if(d.trim().startsWith("{")){
    const t = (d.match(/"type"\s*:\s*"([A-Za-z]+(?:Error|Exception))"/) || [])[1];
    return t ? "上游返回 " + t + " · 悬浮看原文" : "上游返回了非预期响应 · 悬浮看原文";
  }
  return d.length > 90 ? d.slice(0, 90) + "…" : d;
}
function rawDetailTitle(m){
  const d = String(m.detail || "");
  return d.trim().startsWith("{") ? d : "";
}
const chanBadge = (ch) => `<span class="chan-badge chan-${esc(ch)}">${esc(ch)}</span>`;

// 一键主用：设默认模型 + 确保选用，两步都成功才算成。
async function setPrimary(id){
  const cur = STATE.settings.defaultModel;
  if(cur === id){
    const j = await api("/settings", { defaultModel: "" });
    if(j){ toast("已取消主用，恢复按列表第一个"); refresh(); }
    return;
  }
  const m = STATE.models.find(x => x.id === id);
  if(m && m.hidden){
    const v = await api("/models/visibility", { id, hidden: false });
    if(!v) return;
  }
  const j = await api("/settings", { defaultModel: id });
  if(j){ toast("已设为主用模型：" + id + "，正在重新注入已开启的 Agent"); refresh(); }
}

function renderModels(s){
  const el = $("#page-models");
  // 任何输入没变就不重画：任务运行时的 1s 轮询只动数字的话，整页 innerHTML
  // 重建会闪、还会丢滚动位置。
  const sig = JSON.stringify([mf, mview, [...foldedChans], s.probingModel, s.channels,
    s.settings.defaultModel, s.models.map(m => [m.id, m.state, m.hidden, m.ttftMs, m.ttftMedMs,
      m.quotaUsed, m.quotaEstimate, m.throttledAt, m.task && m.task.status, m.detail])]);
  if(el.dataset.sig === sig) return;
  const scrollY = window.scrollY;
  el.dataset.sig = sig;

  const sorted = [...s.models].sort((a,b)=>{
    if(a.id===s.probingModel) return -1;
    if(b.id===s.probingModel) return 1;
    return (STATE_ORDER[a.state]??1)-(STATE_ORDER[b.state]??1);
  });
  const laneModels = s.models.filter(m=>!m.custom);
  const customModels = s.models.filter(m=>m.custom);
  const customProbed = customModels.filter(m=>m.state!=="custom").length;
  const avail = laneModels.filter(m=>m.state==="available" && !m.hidden).length;
  const hiddenCount = s.models.filter(m=>m.hidden).length;
  const blurbCount = new Map();
  for(const m of sorted) if(m.blurb) blurbCount.set(m.blurb, (blurbCount.get(m.blurb)||0)+1);
  const sharedBlurbs = [...blurbCount].filter(([,n])=>n>=3).map(([b])=>b);
  const sharedBlurbSet = new Set(sharedBlurbs);
  const sharedNote = sharedBlurbs.length
    ? `<div class="mnote"><span class="k">说明</span><div>${sharedBlurbs.map(b=>`<div>${esc(b)}</div>`).join("")}</div></div>` : "";

  // ---- hero：现在用哪个 ----
  const defId = s.settings.defaultModel || "";
  const defModel = defId ? s.models.find(m => m.id === defId) : null;
  const candidates = s.models.filter(m => m.state === "available" && !m.hidden && !m.systemOne);
  const best = (defModel && defModel.state === "available" && !defModel.hidden && !defModel.systemOne)
    ? defModel
    : (candidates.length ? candidates.reduce((a,b) => {
        const ka = (a.ttftMedMs||a.ttftMs||99999) - (b.ttftMedMs||b.ttftMs||99999);
        return ka !== 0 ? (ka < 0 ? a : b) : ((b.contextWindow||0) - (a.contextWindow||0) > 0 ? b : a);
      }) : null);
  let hero = "";
  if(best){
    const isPrimary = best.id === defId;
    const chans = best.channels && best.channels.length ? best.channels : [best.custom?"custom":(best.channel||"zen")];
    const caps = [best.vision?"视觉":"", best.audioInput?"音频":"", best.fileInput?"文件":"", best.reasoning?"思考":""].filter(Boolean).join(" · ");
    hero = `<div class="hero${defModel && defModel.id !== best.id ? " degraded" : ""}">
      <div>
        <div class="h-name">${isPrimary ? "主用中：" : "现在用这个："}${esc(best.name)}</div>
        <div class="h-meta">
          ${chans.map(chanBadge).join(" ")}
          <span>首字 <b>${best.ttftMs?(best.ttftMs/1000).toFixed(1)+"s":(best.ttftMedMs?(best.ttftMedMs/1000).toFixed(1)+"s":"—")}</b></span>
          ${best.contextWindow?`<span>上下文 <b>${fmtCap(best.contextWindow)}</b></span>`:""}
          ${caps?`<span>${esc(caps)}</span>`:""}
        </div>
        ${defModel && defModel.id !== best.id && defModel.state !== "available" ? `<div class="h-meta" style="margin-top:4px;color:var(--warn)">你的默认 ${esc(defModel.id)} 当前${defModel.state==="throttled"?"限流中":"不可用"}，建议切换</div>` : ""}
      </div>
      <div class="h-act">
        <button class="btn-primary" data-primary="${esc(best.id)}" ${isPrimary?"disabled":""} title="设为默认模型并确保出现在 Agent 选择器里">${isPrimary?"✓ 当前主用":"设为主用"}</button>
      </div>
    </div>`;
  } else if(laneModels.length){
    const region = laneModels.filter(m=>m.state==="region-blocked").length;
    hero = `<div class="hero degraded"><div>
      <div class="h-name">当前出口没有实测可用的免费模型</div>
      <div class="h-meta">${region?`<span>${region} 个被地区门拦下——换海外出口（订阅轮询）大概率直接可用</span>`:"<span>多半是限流窗口，等一会儿或换出口再试</span>"}</div>
    </div></div>`;
  }

  // ---- 计数 ----
  const cnt = (arr, fn) => arr.filter(fn).length;
  const stateCounts = {
    available: cnt(s.models, m=>m.state==="available"),
    throttled: cnt(s.models, m=>m.state==="throttled"),
    "region-blocked": cnt(s.models, m=>m.state==="region-blocked"),
    unavailable: cnt(s.models, m=>m.state==="unavailable"),
    unknown: cnt(s.models, m=>m.state==="unknown"||m.state==="custom"),
  };

  // ---- 双层吸顶工具栏 ----
  const chip = (kind, id, label, n) =>
    `<span class="mchip ${mf[kind]===id?"on":""}${n===0?" zero":""}" data-${kind}="${id}">${label}${n!=null?`<span class="cnt">${n}</span>`:""}</span>`;
  const active = mf.q || mf.chan || mf.state;
  const toolbar = `<div class="msticky">
    <h2 class="pt">模型 <span class="sub">${avail}/${laneModels.length} 可用${customModels.length?` · 自定义 ${customProbed}/${customModels.length} 已实测`:""}${hiddenCount?` · 已隐藏 ${hiddenCount}`:""}</span></h2>

      <input class="msearch" id="m-q" placeholder="搜索模型 id / 名称…" value="${esc(mf.q)}">
      <select class="msearch" id="m-def" title="注入到各 Agent 配置里的默认模型（留空 = 列表第一个）" style="width:auto;cursor:pointer">
        <option value="">默认模型：（列表第一个）</option>
        ${sorted.filter(m=>!m.hidden&&!m.systemOne).map(m=>`<option value="${esc(m.id)}" ${s.settings.defaultModel===m.id?"selected":""}>默认：${esc(m.id)}</option>`).join("")}
      </select>
      <button class="ghost" id="reprobe">重新探测可用性</button>
      <span class="muted" style="font-size:12px" id="eg-line"></span>
      <span class="vtoggle" style="margin-left:auto" title="卡片看细节，列表快扫全量">

      </span>
    </div>
    <div class="mfilters">
      ${chip("chan","","全部渠道",null)}
      ${["zen","kilo","workbuddy","codearts"].map(c=>chip("chan",c,c,cnt(s.models,m=>!m.custom&&(m.channel||"zen")===c))).join("")}
      ${chip("chan","custom","自定义",customModels.length)}
      <span style="width:8px"></span>
      ${chip("state","","全部状态",null)}
      ${chip("state","available","可用",stateCounts.available)}
      ${chip("state","throttled","限流",stateCounts.throttled)}
      ${chip("state","region-blocked","地区受限",stateCounts["region-blocked"])}
      ${chip("state","unavailable","不可用",stateCounts.unavailable)}
      <span style="width:8px"></span>
      <button class="ghost" id="hide-dead" title="把探测为不可用 / 地区受限的模型从 Agent 选择器隐藏；探到可用会自动解除">隐藏全部不可用</button>
      <button class="ghost" id="show-all" title="恢复全部隐藏的模型${hiddenCount?`（当前 ${hiddenCount} 个）`:""}">恢复显示</button>
      <span class="muted" id="m-count" style="font-size:11.5px;margin-left:auto"></span>
      ${active?`<span class="mchip on" id="m-clear" style="cursor:pointer">✕ 清除筛选</span>`:""}
    </div></div>
  </div>`;

  // ---- 过滤 ----
  const chans = s.channels || [];
  const chanState = Object.fromEntries(chans.map(c=>[c.id, c]));
  const match = (m) =>
    (!mf.q || (m.id+" "+(m.name||"")).toLowerCase().includes(mf.q.toLowerCase()))
    && (!mf.chan || mf.chan === (m.custom ? "custom" : (m.channel || "zen")))
    && (!mf.state || m.state === mf.state);

  const groups = [];
  for(const ch of ["zen","kilo","workbuddy","codearts"]){
    const meta = CHAN_META[ch];
    const st = chanState[ch] || { enabled: true, models: 0 };
    groups.push({ ch, meta, enabled: st.enabled, roster: st.models, refreshedAt: st.refreshedAt||0,
      cards: sorted.filter(m => !m.custom && (m.channel||"zen") === ch) });
  }
  groups.push({ ch: "custom", meta: CHAN_META.custom, enabled: true, roster: customModels.length,
    cards: sorted.filter(m => m.custom) });

  const totalShown = s.models.filter(match).length;

  // ---- 列表视图 ----
  let listBody = "";
  if(mview === "list"){
    const rows = s.models.filter(m => !m.systemOne && match(m));
    listBody = `<table class="mlist"><thead><tr>
      <th>状态</th><th>模型</th><th>渠道</th><th>首字</th><th>典型</th><th>上下文</th><th>输出</th><th>能力</th><th style="text-align:right">操作</th>

      anyShown = anyShown || shown.length > 0;
      // 可用为 0 的渠道默认折叠（手动展开记住）；明确筛选时不折叠
      const folded = !disabled && availInGroup === 0 && !mf.state && (!mf.chan || mf.chan === g.ch) && foldedChans.has(g.ch);
      body += `<div class="msec">
        <span class="dot ${disabled?"off":"on"}"></span>
        <span class="chname">${esc(g.meta.name)}</span>
        ${g.ch!=="custom"?chanBadge(g.ch):`<span class="chan-badge chan-custom">custom</span>`}
        <span class="chdesc">${esc(g.meta.desc)}</span>
        ${disabled?`<span class="pill region">已停用</span><button class="ghost" data-en="${g.ch}">启用</button>`
          :`<span class="chcount">${shown.length}/${g.cards.length} 个${availInGroup?` · 可用 ${availInGroup}`:""}${g.ch!=="custom"&&g.roster?` · 名单 ${g.roster}${g.refreshedAt?` · 更新 ${new Date(g.refreshedAt*1000).toTimeString().slice(0,5)}`:""}`:""}</span>
            ${!disabled && availInGroup === 0 && !mf.state && (!mf.chan || mf.chan === g.ch) ? `<button class="ghost fold" data-fold="${g.ch}">${folded?"展开":"收起"}</button>`:""}`}
      </div>`;
      if(disabled && !shown.length){
        body += `<div class="mempty">渠道已停用 —— 它的 ${g.roster||0} 个模型已从所有 Agent 选择器撤下；点「启用」按渠道文件里的名单恢复。</div>`;
        continue;
      }
      if(folded){
        body += `<div class="mempty" style="padding:8px 0">当前出口这组全部不可用已折叠 · <button class="ghost fold" data-fold="${g.ch}" style="padding:2px 8px">展开看 ${shown.length} 个</button></div>`;

      if(!shown.length){

        const effLevel = (s.modelPrefs||{})[m.id] || s.settings.defaultEffort || "balanced";
        const canonEff = (rid, i, n) => ({light:"light",minimal:"light",low:"light",
          balanced:"balanced",medium:"balanced",deep:"deep",high:"deep",xhigh:"deep",max:"deep"}[String(rid).toLowerCase()]
          || (n<=1 ? "balanced" : i < n/3 ? "light" : i < 2*n/3 ? "balanced" : "deep"));
        const eff = (m.efforts||[]).map((e,i,arr)=>`<span class="eff m-eff" data-m="${esc(m.id)}" data-eff="${esc(e.id)}"
          title="点一下 = 这个模型无明确档位的请求都走这一档（★ 为当前默认；再点一次清除）"
          style="cursor:pointer">${esc(e.zh || e.name || e.id)} <b>${(e.tokens/1024|0)}K</b>${canonEff(e.id,i,arr.length)===effLevel?" ★":""}</span>`).join("");
        const probeBusy = !!(m.task && m.task.kind === "probe" && m.task.status === "running");
        const capsBusy = !!(m.task && m.task.kind === "caps" && m.task.status === "running");
        const pill = m.id === s.probingModel
          ? `<span class="pill warn">探测中…</span>`
          : (m.hidden ? `<span class="pill hidsync">已隐藏</span>` : statePill(m.state));
        let quotaRow = "";
        if(!m.systemOne && !m.custom){
          const used = m.quotaUsed||0, est = m.quotaEstimate||0;
          const parts = [];
          if(est > 0){
            const pct = Math.min(100, Math.round(used/est*100));
            const cls = pct > 90 ? "bad" : (pct > 70 ? "warn" : "ok");
            parts.push(`<div class="qbar" title="今日 ${fmtK(used)} / 预估额度 ${fmtK(est)} tok"><i class="${cls}" style="width:${pct}%"></i></div>`
              + `<div class="qtext">今日 ${fmtK(used)} / 预估 ${fmtK(est)} · ${pct}%</div>`);
          } else if(used > 0){
            parts.push(`<div class="qtext">今日 ${fmtK(used)} tok · 额度统计中</div>`);
          }
          if(m.throttledAt){
            const since = fmtUptime(Math.max(1,(Date.now()-m.throttledAt)/1000));
            const eta = m.recoverEta ? ` · 预计 ${new Date(m.recoverEta).toTimeString().slice(0,5)} 恢复` : "";
            parts.push(`<div class="qtext warn2">暂时限流 ${since}${eta}</div>`);
          }
          if(parts.length) quotaRow = `<div class="mquota">${parts.join("")}</div>`;
        }
        const tags = (m.systemOne?'<span class="pill warn">判断模型</span>':"")
          + (m.vision?'<span class="tag">视觉</span>':"")
          + (m.audioInput?'<span class="tag">音频</span>':"")
          + (m.fileInput?'<span class="tag">文件</span>':"")
          + (m.reasoning?'<span class="tag">思考</span>':"")
          + (m.tagSource==="实测"?'<span class="tag" style="opacity:.65">实测</span>':"");
        const meta = [];
        if(m.ttftMs || m.ttftMedMs){
          meta.push(`<span title="最近一次探测的首字${m.ttftCount?`；近 ${m.ttftCount} 次样本中位数 ${m.ttftMedMs?(m.ttftMedMs/1000).toFixed(1)+"s":"—"}，路由按它排序`:""}">首字 <b>${m.ttftMs?(m.ttftMs/1000).toFixed(1)+"s":"—"}</b>${m.ttftMedMs?` <span style="opacity:.7">· 典型 ${(m.ttftMedMs/1000).toFixed(1)}s</span>`:""}</span>`);
        }
        if(m.contextWindow) meta.push(`<span title="${m.custom?"供应商 /v1/models 声明或 AI 标注给出":"本地能力表"}">上下文 <b>${fmtCap(m.contextWindow)}</b></span>`);
        if(m.maxOutput) meta.push(`<span title="${m.custom?"供应商声明的完成上限（只写回显上下文窗口的供应商不显示）":"本地能力表"}">输出 <b>${fmtCap(m.maxOutput)}</b></span>`);
        const hd = humanDetail(m);
        const rawTitle = rawDetailTitle(m);
        const isPrimary = s.settings.defaultModel === m.id;
        card.innerHTML = `
          <div class="mhead">
            <button class="starbtn ${isPrimary?"on":""}" data-primary="${esc(m.id)}" title="${isPrimary?"当前主用模型，点一下取消":"设为主用（默认模型 + 出现在选择器）"}">★</button>
            <span class="mname" title="${esc(m.name)}">${esc(m.name)}</span>${pill}</div>
          <div class="mid">${(m.channels&&m.channels.length?m.channels:[m.custom?"custom":(m.channel||"zen")]).map(chanBadge).join(" ")} <span style="opacity:.85">${esc(m.id)}</span></div>
          ${m.blurb && !sharedBlurbSet.has(m.blurb)?`<div class="mblurb${openBlurbs.has(m.id+"|"+m.blurb.slice(0,20))?" open":""}" data-bk="${esc(m.id)}|${esc(m.blurb.slice(0,20))}" title="${esc(m.blurb)}">${esc(m.blurb)}</div>`:""}
          ${meta.length?`<div class="mmeta">${meta.join("")}</div>`:""}
          ${(tags||eff)?`<div class="mtags">${tags}${eff?`<span class="meff">${eff}</span>`:""}</div>`:""}
          ${quotaRow}
          ${hd?`<div class="mdetail" ${rawTitle?`title="${esc(rawTitle)}"`:""}>${esc(hd)}</div>`:""}
          ${taskBand(m)}
          <div class="mfoot">
            <button class="vpill ${m.hidden?"":"on"}" data-vis="${esc(m.id)}" title="出现在 Agent 的模型选择器里；关掉只是不展示，点名调用仍可用">${m.hidden?"＋ 选用":"✓ 已选用"}</button>
            <span>
              <button class="ghost mtest" data-m="${esc(m.id)}" ${probeBusy?"disabled":""} title="${m.custom?"向该供应商发一个最小请求，实测可用性与首字延迟":"单独探测这个模型的可用性"}">${probeBusy?"测试中…":"测试"}</button>
              ${m.custom?`<button class="ghost capstest" data-m="${esc(m.id)}" ${capsBusy?"disabled":""} title="用你的 Key 发最小图像 / 音频 / PDF 请求，实测该模型真正支持的输入模态（结果最优先）">${capsBusy?"实测中…":"能力实测"}</button>`:""}
            </span>
          </div>`;
        body += card.outerHTML;
      }
      body += `</div>`;
    }
    if(!anyShown && (mf.q || mf.chan || mf.state)){
      body += `<div class="mempty">没有匹配的模型 —— 换个筛选条件试试</div>`;
    }
  }

  el.innerHTML = `${toolbar}${hero}${sharedNote}${mview==="list"?listBody:body}`;
  el.querySelector("#m-count").textContent = `${totalShown} 个结果`;

  el.querySelector("#eg-line").textContent = s.egress&&s.egress.ip ? `出口: ${s.egress.ip} (${s.egress.country||"?"})` : "出口未知";
  el.querySelector("#reprobe").onclick = async ()=>{ toast("探测中，稍后刷新…"); await api("/reprobe", {}); setTimeout(refresh, 4000); };
  el.querySelector("#hide-dead").onclick = async ()=>{
    const ids = s.models.filter(m=>!m.hidden && (m.state==="unavailable"||m.state==="region-blocked")).map(m=>m.id);
    if(!ids.length){ toast("没有探测为不可用的模型"); return; }
    const j = await api("/models/visibility", { ids, hidden: true, auto: true });
    if(j){ toast("已隐藏 " + ids.length + " 个（探到可用会自动恢复）；正在重新注入已开启的 Agent"); refresh(); }
  };
  el.querySelector("#show-all").onclick = async ()=>{
    const ids = s.models.filter(m=>m.hidden).map(m=>m.id);
    if(!ids.length){ toast("没有隐藏中的模型"); return; }
    const j = await api("/models/visibility", { ids, hidden: false });
    if(j){ toast("已全部恢复显示"); refresh(); }
  };
  el.querySelectorAll(".mchip[data-chan]").forEach(ch=>{
    ch.onclick = ()=>{ mf.chan = ch.dataset.chan; renderModels(s); };
  });
  el.querySelectorAll(".mchip[data-state]").forEach(ch=>{
    ch.onclick = ()=>{ mf.state = ch.dataset.state; renderModels(s); };
  });
  const clearEl = el.querySelector("#m-clear");
  if(clearEl) clearEl.onclick = ()=>{ mf = { q:"", chan:"", state:"" }; renderModels(s); };
  el.querySelectorAll(".vtoggle button").forEach(b=>{
    b.onclick = ()=>{ mview = b.dataset.view; localStorage.setItem("zengate.mview", mview); renderModels(s); };
  });
  el.querySelectorAll("[data-fold]").forEach(b=>{
    b.onclick = ()=>{
      const ch = b.dataset.fold;
      if(foldedChans.has(ch)) foldedChans.delete(ch); else foldedChans.add(ch);
      localStorage.setItem("zengate.mfold", JSON.stringify([...foldedChans]));
      renderModels(s);
    };
  });
  el.querySelectorAll("[data-primary]").forEach(b=>{
    b.onclick = ()=>setPrimary(b.dataset.primary);
  });
  const qEl = el.querySelector("#m-q");
  qEl.oninput = ()=>{ mf.q = qEl.value; renderModels(s); const n = el.querySelector("#m-q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  el.querySelector("#m-def").onchange = async (ev)=>{
    const j = await api("/settings", { defaultModel: ev.target.value });
    if(j) toast(ev.target.value ? "默认模型已更新，正在重新注入已开启的 Agent" : "已恢复按列表第一个作为默认");
    refresh();
  };
  el.querySelectorAll("[data-en]").forEach(b=>{
    b.onclick = async ()=>{
      const j = await api("/channel/"+b.dataset.en+"/enabled", { enabled: true });
      if(j){ toast("渠道已启用，模型按渠道文件名单恢复"); refresh(); }
    };
  });
  // 选用开关：vpill 即旧 checkbox 的语义（hidden 翻转），视觉升级为明确状态。
  el.querySelectorAll(".vpill[data-vis]").forEach(b=>{
    b.onclick = async ()=>{
      const hidden = b.classList.contains("on"); // on=已选用 → 点击即隐藏
      const j = await api("/models/visibility", { id: b.dataset.vis, hidden });
      if(j) toast(hidden ? "已隐藏，正在重新注入已开启的 Agent" : "已选用，正在重新注入已开启的 Agent");
      refresh();
    };
  });
  el.querySelectorAll(".mblurb").forEach(b=>{
    b.onclick = ()=>{
      b.classList.toggle("open");
      const key = b.dataset.bk;
      if(b.classList.contains("open")) openBlurbs.add(key); else openBlurbs.delete(key);
    };
  });
  el.querySelectorAll(".m-eff").forEach(ch=>{
    ch.onclick = async ()=>{
      const on = ch.textContent.includes("★");
      const j = await api("/models/pref", { id: ch.dataset.m, effort: on ? "" : ch.dataset.eff });
      if(j){ toast(on ? "已恢复按全局默认档" : "已设为该模型的默认思考档"); refresh(); }
    };
  });
  el.querySelectorAll(".mtest").forEach(b=>{
    b.onclick = async ()=>{
      b.disabled = true; b.textContent = "测试中…";
      const j = await api("/probe/"+encodeURIComponent(b.dataset.m), {});
      if(j && j.running){ toast("这个模型正在测试中，进度看卡片"); refresh(); return; }
      if(j && j.result){
        const r = j.result;
        const sec = r.ttftMs ? "首字 " + (r.ttftMs/1000).toFixed(1) + "s" : "";
        if(r.state==="available") toast("✓ 可用" + (sec?" · "+sec:""));
        else if(r.state==="throttled") toast("暂时限流·可重试 —— 请求在生成前就被拒绝，没有首字数据" + (r.detail?" · "+humanDetail({detail:r.detail}):""));
        else if(r.state==="unavailable") toast("不可用 · " + (r.detail||""));
        else toast("探测未成功 · " + (r.detail||"上游无响应，稍后再试"));
      }
      refresh();
    };
  });
  el.querySelectorAll(".capstest").forEach(b=>{
    b.onclick = async ()=>{
      b.disabled = true; b.textContent = "实测中…";
      const j = await api("/tags/probe", { id: b.dataset.m });
      if(j && j.running){ toast("能力实测进行中，进度看卡片"); refresh(); return; }
      if(j && j.ok) toast("能力实测已开始（图像/音频/PDF 各一发），进度看卡片");
      else if(j && j.error) toast("实测失败 · " + j.error);
      refresh();
    };
  });
  el.querySelectorAll(".tdet").forEach(b=>{
    b.onclick = ()=>openTaskDrawer(b.dataset.m);
  });
  // 有探测在跑：卡片自己按 250ms 走动计时，并用 1s 的节奏跟服务端要新阶段。
  startTaskTicker();
  clearTimeout(fastPollTimer);
  if(sorted.some(m=>m.task && m.task.status === "running")) fastPollTimer = setTimeout(refresh, 1000);
  window.scrollTo(0, scrollY);
}

async function renderQoderCard(){
  const st = await fetch("/admin/api/qoder/status").then(r=>r.json()).catch(()=>null);
  const stateEl = $("#qoder-state"), body = $("#qoder-body");
  if(!stateEl || !body) return;
  const repo = 'https://github.com/Morpheus799/qodercn-gateway';
  if(!st || !st.running){
    stateEl.textContent = "未运行";
    body.innerHTML = '内置 Qoder 网关没有启动——通常是 8095 端口被其他 qodercn-gateway 实例占用' +
      '（关掉那个实例并重启 zen-gate 即可）。' +
      '然后打开 <a href="'+repo+'" target="_blank">Qoder IDE</a> 登录一次，模型会自动出现。';
    return;
  }
  // The device login works with no IDE at all: the grant is what mints the
  // credential, so the button has to survive the "not logged in" branch below.
  const btnLogin = $("#qoder-login");
  if(btnLogin) btnLogin.style.display = st.poolEnabled ? "" : "none";
  if(!st.loggedIn){
    stateEl.textContent = "未登录";
    body.innerHTML = '网关在线，但还没有可用的 Qoder 登录。' +
      (st.poolEnabled
        ? '直接点「授权登录」，在浏览器里登录一个 Qoder 账号——凭据会进账号池，不用先开 IDE；想加第二个号就再点一次。'
        : '打开 <a href="'+repo+'" target="_blank">Qoder IDE</a> 登录一次——网关每个请求都会重读凭据，刷新后模型自动恢复，无需重启网关。') +
      (st.detail ? '<div class="acc-note">'+esc(st.detail)+'</div>' : '');
    qoderRenderPool(st);
    return;
  }
  const pool = st.pool || [];
  stateEl.textContent = "已登录 · " + (st.models||[]).length + " 个模型" +
    (st.poolEnabled ? " · " + pool.length + " 个账号" : "");
  body.innerHTML = '模型已进入所有 Agent 选择器（<code>qoder/模型名</code>）。' +
    (st.poolEnabled
      ? '一个账号的额度用满或登录失效时，同一个请求会自动换下一个账号接着答。'
      : '当前只用 Qoder IDE 的那一份登录——把它收录进账号池，就能在 IDE 掉线时继续用。') +
    '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">' +
    (st.models||[]).map(m=>'<span class="badge">'+m.replace(/^qoder\//,'')+'</span>').join('') +
    '</div>';
  qoderRenderPool(st);
}

// 池子里一个账号卡的状态：文案只说事实，颜色由 cls 走主题变量（原来写死 #c55/#c88）。
function qoderPoolState(a){
  if(a.state === "auth") return {text:"登录失效", cls:"bad"};
  if(a.state === "disabled") return {text:"已停用", cls:"unknown"};
  if(a.state === "cooldown") return {text:"限流中", cls:"warn"};
  if(a.state === "ok") return {text:"可用", cls:"ok"};
  return {text:a.state || "未知", cls:"unknown"};
}

function qoderRenderPool(st){
  const list = $("#qoder-pool");
  if(!list) return;
  const pool = st.pool || [];
  if(!st.poolEnabled){ list.innerHTML = ""; return; }
  // Several device logins may be waiting at once — that is how a second and
  // third account get added — so the count is part of the roster's state.
  const waiting = qoderLoginTimers.size ? `<div class="acc-wait"><span class="dot"></span>` +
    `正在等待 ${qoderLoginTimers.size} 个授权窗口完成：在浏览器里登录后账号会自动进池；` +
    `期间可以再点「授权登录」继续加号。</div>` : "";
  if(!pool.length){
    list.innerHTML = waiting + '<div class="acc-empty">账号池还是空的。点「授权登录」在浏览器里登录一个 Qoder 账号——' +
      '凭据直接进池，想加第二个号就再点一次；也可以点「收录当前 IDE 登录」把 IDE 里现在这个号存进来。</div>';
    return;
  }
  list.innerHTML = waiting + pool.map((a, i) => {
    const s = qoderPoolState(a);
    const now = i === 0;
    const name = esc(a.label || a.uid || a.id || "-");
    const uid = a.uid ? `<div class="acc-id" title="${esc(a.uid)}">uid ${esc(a.uid)}</div>` : "";
    const until = a.state === "cooldown" && a.cooldownUntil
      ? new Date(a.cooldownUntil).toLocaleTimeString().slice(0,5) : "";
    const chips = [];
    if(now) chips.push('<span class="acc-chip now">当前接单</span>');
    if(!a.enabled) chips.push('<span class="acc-chip">已停用 · 不参与轮转</span>');
    if(until) chips.push(`<span class="acc-chip warn">${until} 恢复</span>`);
    // A device-authorized account expires on its own; say when, so a dead row
    // is not mistaken for an upstream outage.
    if(a.expiresAt){
      const left = Math.ceil((new Date(a.expiresAt) - Date.now()) / 86400000);
      chips.push(left <= 3
        ? `<span class="acc-chip warn">${left <= 0 ? "登录已过期" : "还有 " + left + " 天过期"}</span>`
        : `<span class="acc-chip">还有 ${left} 天过期</span>`);
    }
    const note = a.lastError
      ? `<div class="acc-note${s.cls === "bad" ? " bad" : ""}">${esc(a.lastError)}</div>` : "";
    return `<div class="acc${now ? " now" : ""}${a.enabled ? "" : " off"}" data-id="${esc(a.id)}">
      <div class="acc-hd">
        <span class="acc-idx">${i+1}</span>
        <span class="acc-name" title="${name}">${name}</span>
        <span class="pill ${s.cls} acc-badge">${s.text}</span>
      </div>
      ${uid}
      ${note}
      <div class="acc-chips">${chips.join("")}</div>
      <div class="acc-acts">
        <button class="qoder-act" data-act="primary" data-id="${esc(a.id)}"${now ? " disabled" : ""}>优先使用</button>
        <button class="qoder-act" data-act="toggle" data-id="${esc(a.id)}" data-enabled="${a.enabled ? "0" : "1"}">${a.enabled ? "停用" : "启用"}</button>
        <button class="qoder-act danger" data-act="delete" data-id="${esc(a.id)}">移除</button>
      </div>
    </div>`;
  }).join("");
}

// Device logins are independent windows, so several can be open at once —
// that is the whole point of "sign another account in". Each state gets its
// own timer; the pool list shows how many are still waiting.
const qoderLoginTimers = new Map();

// pollQoderLogin follows one authorization window until the browser finishes.
// Pending is the normal answer — 404/202 upstream — so it stays quiet.
function pollQoderLogin(state){
  if(qoderLoginTimers.has(state)) return;
  const started = Date.now();
  const stop = () => { clearInterval(timer); qoderLoginTimers.delete(state); };
  const timer = setInterval(async () => {
    if(Date.now() - started > 10 * 60 * 1000){
      stop();
      toast("授权窗口超时，请重新点「授权登录」");
      renderQoderCard();
      return;
    }
    const j = await api("/qoder/pool", { action: "login-poll", state });
    if(!j){ stop(); renderQoderCard(); return; }
    if(j.status === "pending") return;
    stop();
    if(j.status === "ok"){
      toast("已加入账号池：" + ((j.account && j.account.label) || "Qoder 账号"));
    } else {
      toast(j.message || "授权没有完成");
    }
    renderQoderCard();
  }, 2500);
  qoderLoginTimers.set(state, timer);
}

function bindQoderCard(){
  const card = $("#qoder-card");
  if(!card || card.dataset.bound) return;
  card.dataset.bound = "1";
  const lg = $("#qoder-login");
  if(lg) lg.onclick = async () => {
    lg.disabled = true;
    const start = await api("/qoder/pool", { action: "login-start" });
    lg.disabled = false;
    if(!start || !start.authUrl){ if(!start) toast("无法发起 Qoder 授权"); return; }
    window.open(start.authUrl, "_blank", "noopener");
    toast("已在浏览器打开 Qoder 授权页，登录完成后账号会自动进来");
    pollQoderLogin(start.state);
    renderQoderCard();
  };
  const imp = $("#qoder-import");
  if(imp) imp.onclick = async () => {
    imp.disabled = true;
    const j = await api("/qoder/pool", { action: "import" });
    imp.disabled = false;
    if(j && j.ok) toast("已收录当前 Qoder IDE 登录到账号池");
    renderQoderCard();
  };
  // Rows are re-rendered on every refresh, so actions are delegated.
  const list = $("#qoder-pool");
  if(list) list.onclick = async (ev) => {
    const btn = ev.target.closest(".qoder-act");
    if(!btn) return;
    const id = btn.dataset.id, act = btn.dataset.act;
    btn.disabled = true;
    let j = null;
    if(act === "primary") j = await api("/qoder/pool", { action: "primary", id });
    else if(act === "toggle") j = await api("/qoder/pool", { action: "toggle", id, enabled: btn.dataset.enabled === "1" });
    else if(act === "delete"){
      if(!confirm("从这个账号池里移除该账号？（IDE 里的登录不受影响）")){ btn.disabled = false; return; }
      j = await api("/qoder/pool", { action: "delete", id });
    }
    if(j && j.ok) toast("账号池已更新");
    renderQoderCard();
  };
}

/* CodeArts 账号渠道卡（华为云）：状态读 /admin/api/codearts/status，登录是
   PKCE + 回调/轮询双通道——服务端在默认浏览器打开授权页，这里两秒一探。
   与 WorkBuddy 卡同一套形态：登录、退出、启用开关。 */
let caPollTimer = null;
async function renderCodeartsCard(){
  const st = await fetch("/admin/api/codearts/status").then(r=>r.json()).catch(()=>null);
  const state = $("#ca-state"), body = $("#ca-body");
  if(!state || !body || !st){ if(state) state.textContent = "状态获取失败"; return; }
  setToggle("#tg-codearts", !!st.enabled);
  const lg = $("#ca-logout");
  if(lg) lg.style.display = st.loggedIn ? "" : "none";
  const lb = $("#ca-login");
  if(lb) lb.style.display = st.loggedIn ? "none" : "";
  if(!st.loggedIn){
    state.textContent = "未登录";
    body.innerHTML = '用华为云账号授权后，CodeArts Agent 的免费模型（GLM / DeepSeek / Qwen-VL 与轮换的限时福利套餐）'+
      '直接进入「模型」页和所有 Agent 选择器，每日自动签到领积分（官方活动截至 '+
      '<span style="white-space:nowrap">2026-12-31</span>）。'+
      '提示词可能被上游记录，别交机密内容。';
    return;
  }
  state.textContent = st.enabled ? "已启用" : "已停用";
  const exp = st.expiresAtMs ? new Date(st.expiresAtMs).toLocaleString() : "未知";
  body.innerHTML = '账号 <b>' + (st.nickname || st.uid || "-") + '</b> · STS 凭证有效期至 ' + exp +
    ' · 目录模型 <b>' + (st.models || 0) + '</b> · 上次签到 ' + (st.lastCheckinDate || "—") +
    (st.canRefresh ? '' : '<br><span style="color:#c88">缺少可续期凭据，重新授权一次</span>');
}
function bindCodeartsCard(){
  const card = $("#ca-card");
  if(!card || card.dataset.bound) return;
  card.dataset.bound = "1";
  $("#ca-login").onclick = async () => {
    const b = $("#ca-login");
    b.disabled = true;
    const j = await api("/codearts/login/start", {});
    b.disabled = false;
    if (!j || !j.authUrl) return;
    // 服务端已用系统默认浏览器打开授权页；这里给出链接兜底并两秒轮询。
    const state = $("#ca-state"), body = $("#ca-body");
    state.textContent = "等待授权…";
    body.innerHTML = '授权页已在你的默认浏览器打开（华为云账号登录 + 账号授权）。' +
      '没有自动弹出时 <a href="' + j.authUrl + '" target="_blank" rel="noopener">点这里打开授权页</a>。' +
      '完成后这里自动换 STS 凭证并拉取模型目录（有效期最长 5 分钟）。';
    const deadline = Date.now() + 5*60*1000;
    if (caPollTimer) clearInterval(caPollTimer);
    caPollTimer = setInterval(async () => {
      if (Date.now() > deadline) { clearInterval(caPollTimer); caPollTimer = null; renderCodeartsCard(); return; }
      const p = await fetch("/admin/api/codearts/login/poll").then(r=>r.json()).catch(()=>null);
      if (p && p.state === "ok") {
        clearInterval(caPollTimer); caPollTimer = null;
        toast("CodeArts 授权成功，免费模型进入目录中");
        renderCodeartsCard();
      } else if (p && p.state === "error") {
        clearInterval(caPollTimer); caPollTimer = null;
        toast("CodeArts 登录未完成：" + (p.error || "请重试"));
        renderCodeartsCard();
      }
    }, 2000);
  };
  $("#ca-logout").onclick = async () => {
    const j = await api("/codearts/logout", {});
    if (j) toast("已退出 CodeArts 账号");
    renderCodeartsCard();
  };
  const tgb = $("#tg-codearts");
  tgb.onclick = async () => {
    const on = tgb.dataset.on !== "1";
    const j = await api("/settings", { codeArtsEnabled: on });
    if(j){ setToggle("#tg-codearts", on); toast(on ? "CodeArts 渠道已启用" : "CodeArts 渠道已停用"); }
    renderCodeartsCard();
  };
}

/* WorkBuddy 账号渠道卡：状态读 /admin/api/workbuddy/status，登录走 state 轮询
   （授权页开在新标签，这里两秒一探，拿到令牌即停并刷新）。 */
let wbPollTimer = null;
async function renderWorkBuddyCard(){
  const st = await fetch("/admin/api/workbuddy/status").then(r=>r.json()).catch(()=>null);
  const state = $("#wb-state"), body = $("#wb-body"), list = $("#wb-accounts");
  if(!state || !body || !st){ if(state) state.textContent = "状态获取失败"; return; }
  const accts = st.accounts || [];
  const anyEnabled = accts.some(a => a.enabled);
  setToggle("#tg-workbuddy", anyEnabled);
  const tg = $("#tg-workbuddy");
  // No account, no channel switch: a switch that governs nothing is noise.
  if(tg) tg.style.display = accts.length ? "" : "none";
  const lg = $("#wb-logout");
  if(lg) lg.style.display = accts.length ? "" : "none";
  const ck = $("#wb-checkin");
  if(ck) ck.style.display = accts.some(a => a.canCheckin) ? "" : "none";

  if(!accts.length){
    state.textContent = "未登录";
    body.innerHTML = '用 WorkBuddy / CodeBuddy 账号授权后，免费模型（hy4-preview-f / hy3 / deepseek-v4.1-flash）直接进入「模型」页和所有 Agent 选择器。' +
      '可以登录多个账号：一个账号的免费额度用满后，同一个请求会自动换下一个账号接着答。' +
      '国际版每个账号每日自动发一条极小对话领活跃积分，国内版每个账号每日自动签到。' +
      '免费模型走 24h 窗口限量；提示词可能被上游记录，别交机密内容。';
    if(list) list.innerHTML = "";
    return;
  }

  // 池内合计只在说得出「谁没读到」时才敢说：三行里有两行读数失败，把读到的
  // 两行加起来当总数，卡片就在报一个不存在的余额。
  const known = accts.filter(a => a.creditsKnown);
  let creditLine = "";
  if(known.length){
    const sum = Math.round(known.reduce((s, a) => s + (Number(a.credits) || 0), 0) * 100) / 100;
    creditLine = " · 积分 " + sum + (known.length < accts.length ? `（${accts.length - known.length} 个未读到）` : "");
  } else if(accts.length){
    creditLine = " · 积分 —";
  }
  state.textContent = (anyEnabled ? "已启用 · " + accts.length + " 个账号" : "已停用") + creditLine;
  body.innerHTML = '一个账号的免费额度用满后会自动换下一个账号，对客户端无感；' +
    '每个账号各自每日自动签到 / 领活跃。停用只停止接单，签到与令牌刷新照常（否则它永远回不来）。';
  wbRenderAccounts(st);
}

// 分段控件的当前值：以按下钮为准，dataset.value 只是绑定前的兜底。
function wbRealmValue(){

  if(!seg) return "intl";
  const on = seg.querySelector("button.on");
  return on ? on.dataset.v : (seg.dataset.value || "intl");
}

// 一张卡一个账号：身份（昵称/uid）+ 状态徽标 + 版本域 + 指标 + 操作。
function wbStateBadge(a){
  if(a.state === "auth") return {text:"登录失效", cls:"bad"};
  if(a.state === "unready") return {text:"未登录", cls:"unknown"};
  if(a.state === "disabled") return {text:"已停用", cls:"unknown"};
  if(a.state === "cooldown") return {text:"限流中", cls:"warn"};
  // "ok" is what the pool actually publishes for a healthy account (see
  // wbViews in the lane); the card used to know only "ready", so every usable
  // account wore its raw English enum as the badge.
  if(a.state === "ok" || a.state === "ready" || a.state === undefined || a.state === "") return {text:"可用", cls:"ok"};
  return {text:"状态未知", cls:"unknown"};
}

// 积分不是一种货币，而是一种有到期日的货币：卡片把两桶分开写。
// 窗口天数取自后端（creditsWindow），文案不写死 —— 标签说 15 天、规则用另一个
// 天数，就是在对用户宣布一个我们从未执行过的期限。
function wbCreditSplitChip(a){
  if(!a.creditsKnown) return "";
  const c = v => { const n = Math.round(Number(v || 0) * 100) / 100; return Number.isFinite(n) ? n : 0; };
  const days = a.creditsWindow || 15;
  const soon = c(a.creditsExpiring), rest = c(a.creditsPermanent), dead = c(a.creditsDead);
  if(soon === 0 && rest === 0){
    return `<span class="acc-chip${dead ? " warn" : ""}">无可用积分${dead ? ` · 另有 ${dead} 已失效` : ""}</span>`;
  }
  const parts = [];
  if(soon > 0) parts.push(`${days} 天内到期 <b>${soon}</b>`);
  if(rest > 0) parts.push(`永久 <b>${rest}</b>`);
  if(dead > 0) parts.push(`已失效 ${dead}`);
  // 「永久」是产品口径：它是「15 天后才停止计费」，含上游没公布截止时间的包。
  const hint = `「永久」= ${days} 天后才停止计费（含上游未公布截止时间的包）`;
  return `<span class="acc-chip${soon > 0 ? " warn" : ""}" title="${esc(hint)}">${parts.join(" · ")}</span>`;
}

function wbRenderAccounts(st){
  const list = $("#wb-accounts");
  if(!list) return;
  const accts = st.accounts || [];
  const active = st.activeId || "";
  if(!accts.length){ list.innerHTML = ""; return; }
  const num = v => (v === "" || v === undefined || v === null) ? "—" : esc(String(v));
  list.innerHTML = accts.map((a, i) => {
    const s = wbStateBadge(a);
    const now = a.id === active;
    const name = esc(a.nickname || a.uid || a.id || "-");
    const uid = a.uid ? `<div class="acc-id" title="${esc(a.uid)}">uid ${esc(a.uid)}</div>` : "";
    const exp = a.expiresAtMs ? new Date(a.expiresAtMs).toLocaleDateString() : "—";
    const daily = a.realm === "cn"
      ? `上次签到 <b>${a.lastCheckinDate || "—"}</b>`
      : `上次活跃 <b>${a.lastActivityDate || "—"}</b>`;
    const credits = a.creditsKnown ? `<b>${num(a.credits)}</b>` : "<b>—</b>";
    const meta = [
      `积分 ${credits}`,
      daily,
      `有效期至 <b>${exp}</b>`,
    ];
    if(a.inFlight) meta.push(`在途 <b>${a.inFlight}</b>`);
    if(a.state === "cooldown"){
      if(a.cooldownModel) meta.push(`限流模型 <b>${esc(a.cooldownModel)}</b>`);
      if(a.cooldownUntil) meta.push(`恢复 <b>${new Date(a.cooldownUntil).toLocaleTimeString().slice(0,5)}</b>`);
    }
    const chips = [`<span class="acc-chip">${a.realm === "cn" ? "国内版 codebuddy.cn" : "国际版 workbuddy.ai"}</span>`];
    const split = wbCreditSplitChip(a);
    if(split) chips.push(split);
    if(now) chips.push('<span class="acc-chip now">当前接单</span>');
    if(a.noCheckin) chips.push('<span class="acc-chip">企业账号 · 无每日签到</span>');
    if(!a.enabled) chips.push('<span class="acc-chip">已停用 · 只签到不接单</span>');
    const noteText = a.detail || a.lastError;
    const note = noteText
      ? `<div class="acc-note${s.cls === "bad" ? " bad" : ""}">${esc(noteText)}</div>` : "";
    return `<div class="acc${now ? " now" : ""}${a.enabled ? "" : " off"}" data-id="${esc(a.id)}">
      <div class="acc-hd">
        <span class="acc-idx">${i+1}</span>
        <span class="acc-name" title="${name}">${name}</span>
        <span class="pill ${s.cls} acc-badge">${s.text}</span>
      </div>
      ${uid}
      ${note}
      <div class="acc-meta">${meta.join(" · ")}</div>
      <div class="acc-chips">${chips.join("")}</div>
      <div class="acc-acts">
        <button class="wb-act" data-act="primary" data-id="${esc(a.id)}"${now ? " disabled" : ""}>优先使用</button>
        <button class="wb-act" data-act="toggle" data-id="${esc(a.id)}" data-enabled="${a.enabled ? "0" : "1"}">${a.enabled ? "停用" : "启用"}</button>
        <button class="wb-act danger" data-act="logout" data-id="${esc(a.id)}">退出</button>
      </div>
    </div>`;
  }).join("");
}

function bindWorkBuddyCard(){
  const card = $("#wb-card");
  if(!card || card.dataset.bound) return;
  card.dataset.bound = "1";
  // 登录版本是个二选一：分段控件一眼能看见两个选项，比收起来的下拉少一次点击。
  const realm = $("#wb-realm");
  if(realm){
    realm.querySelectorAll("button").forEach(b => b.onclick = () => {
      realm.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      realm.dataset.value = b.dataset.v;
    });
    realm.dataset.value = realm.querySelector("button.on") ? realm.querySelector("button.on").dataset.v : "intl";
  }
  $("#wb-login").onclick = async () => {
    const b = $("#wb-login");
    b.disabled = true;
    const j = await api("/workbuddy/login/start", { realm: wbRealmValue() });
    b.disabled = false;
    if (!j || !j.authUrl) return;
    // 服务端已用系统默认浏览器打开授权页（复用你已有的 workbuddy.ai 登录态）；
    // 卡片同时给出链接兜底，并进入两秒一轮的令牌轮询。
    const state = $("#wb-state"), body = $("#wb-body");
    state.textContent = "等待授权…";
    body.innerHTML = '授权页已在你的默认浏览器打开。如果你在浏览器里已登录过 WorkBuddy，通常只需点一下确认；' +
      '没有自动弹出时 <a href="' + j.authUrl + '" target="_blank" rel="noopener">点这里打开授权页</a>。' +
      '完成后这里会自动拿到令牌（有效期最长 5 分钟）。已登录的账号不会被替换，新账号会加入账号池。';
    const deadline = Date.now() + 5*60*1000;
    if (wbPollTimer) clearInterval(wbPollTimer);
    wbPollTimer = setInterval(async () => {
      if (Date.now() > deadline) { clearInterval(wbPollTimer); wbPollTimer = null; renderWorkBuddyCard(); return; }
      const p = await fetch("/admin/api/workbuddy/login/poll").then(r=>r.json()).catch(()=>null);
      if (p && p.state === "ok") {
        clearInterval(wbPollTimer); wbPollTimer = null;
        toast("WorkBuddy 账号已加入账号池（已自动补签今日）");
        renderWorkBuddyCard();
      } else if (p && p.state === "error") {
        clearInterval(wbPollTimer); wbPollTimer = null;
        toast("WorkBuddy 登录未完成：" + (p.error || "请重试"));
        renderWorkBuddyCard();
      }
    }, 2000);
  };
  $("#wb-checkin").onclick = async () => {
    const b = $("#wb-checkin");
    b.disabled = true;
    const j = await api("/workbuddy/checkin", {});
    b.disabled = false;
    if (!j) { renderWorkBuddyCard(); return; }
    toast(j.skipped ? "今日已签到（每账号每日一次）" : "国内版每日签到已完成（每轮最多 3 个账号）");
    renderWorkBuddyCard();
  };
  $("#wb-logout").onclick = async () => {
    if (!confirm("退出全部 WorkBuddy 账号？")) return;
    const j = await api("/workbuddy/logout", {});
    if (j) toast("已退出全部 WorkBuddy 账号");
    renderWorkBuddyCard();
  };
  // Per-account actions are delegated: the rows are re-rendered on every
  // refresh, so binding to them directly would lose the handlers.
  $("#wb-accounts").onclick = async (ev) => {
    const btn = ev.target.closest(".wb-act");
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    btn.disabled = true;
    let j = null;
    if (act === "primary") {
      j = await api("/workbuddy/account/primary", { id });
      if (j) toast("已设为优先账号");
    } else if (act === "toggle") {
      const enabled = btn.dataset.enabled === "1";
      j = await api("/workbuddy/account/toggle", { id, enabled });
      if (j) toast(enabled ? "该账号已启用" : "该账号已停用（签到与刷新照常）");
    } else if (act === "logout") {
      if (!confirm("退出这个账号？其他账号不受影响。")) { btn.disabled = false; return; }
      j = await api("/workbuddy/logout", { id });
      if (j) toast("该账号已退出");
    }
    renderWorkBuddyCard();
  };
  const tgb = $("#tg-workbuddy");
  tgb.onclick = async () => {
    const on = tgb.dataset.on !== "1";
    const j = await api("/settings", { workBuddyEnabled: on });
    if(j){ setToggle("#tg-workbuddy", on); toast(on ? "WorkBuddy 渠道已启用（全部账号）" : "WorkBuddy 渠道已停用（全部账号）"); }
    renderWorkBuddyCard();
  };
}

let heatMode = "daily";              // daily | weekly | cumulative
let usageDay = null;

function dayKey(d){ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

function fmtUptime(sec){
  sec = Math.max(0, Math.floor(sec));
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), s=sec%60;
  if(d>0) return d+" 天 "+h+" 小时 "+m+" 分";
  if(h>0) return h+" 小时 "+m+" 分 "+s+" 秒";
  if(m>0) return m+" 分 "+s+" 秒";
  return s+" 秒";
}

let bootAt = null;   // epoch ms of process start, synced from /state uptimeSec
function tickUptime(){
  if(bootAt==null) return;
  const el = $("#uptime-val");
  if(el) el.textContent = fmtUptime((Date.now()-bootAt)/1000);
}
setInterval(tickUptime, 1000);

function buildUsage(s){
  const keys = Object.keys(s.stats.days||{}).sort();
  const byDay = {};
  for(const k of keys){
    const v = s.stats.days[k];
    byDay[k] = { requests:v.requests, failed:v.failed, input:v.input, output:v.output,
      total:(v.input||0)+(v.output||0), models:v.models||{}, modelReqs:v.modelReqs||{}, agents:v.agents||{} };
  }
  const life = {};
  for(const k of keys) for(const [m,o] of Object.entries(byDay[k].models)) life[m]=(life[m]||0)+o;
  const top = Object.entries(life).sort((a,b)=>b[1]-a[1]).slice(0,7);
  return { keys, byDay, top, life };
}

function renderUsage(s){
  const el = $("#page-usage");

  const grand = U.keys.reduce((a,k)=>{ const d=U.byDay[k]; a.out+=d.output; a.inp+=d.input; a.req+=d.requests; a.fail+=d.failed; return a; },{out:0,inp:0,req:0,fail:0});
  const ttfts = recent.filter(r=>r.ttftMs>0).map(r=>r.ttftMs);
  const avgTtft = ttfts.length ? Math.round(ttfts.reduce((a,b)=>a+b,0)/ttfts.length) : null;

      <div class="cell"><div class="v">${fmtN(grand.out)}</div><div class="l">输出 Token</div></div>
      <div class="cell"><div class="v">${grand.req}</div><div class="l">请求数</div></div>
      <div class="cell"><div class="v${grand.fail>0?" bad":""}">${grand.fail}</div><div class="l">失败</div></div>
      <div class="cell"><div class="v">${avgTtft!==null?(avgTtft/1000).toFixed(1)+"s":"—"}</div><div class="l">平均首字</div></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:10px">
        <h3 style="margin:0">Token 活动</h3>
        <div class="seg" id="hm-modes">
          ${["daily","weekly","cumulative"].map(m=>`<button data-m="${m}" class="${heatMode===m?"on":""}">${{daily:"每日",weekly:"每周",cumulative:"累计"}[m]}</button>`).join("")}
        </div>
      </div>
      <div class="hm-scroll">
        <div class="hm" id="hm"></div>
        <div class="hm-months" id="hm-months"></div>
      </div>
      <div class="hm-legend">较少 <i></i><i class="hm-level1"></i><i class="hm-level2"></i><i class="hm-level3"></i><i class="hm-level4"></i> 较多</div>
      <div id="day-detail"></div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <h3>速度与延迟</h3>
      <div class="speedgrid" id="speed"></div>
    </div>

    <div class="two" style="margin-bottom:12px">
      <div class="card"><h3>按模型汇总（累计）</h3><div id="by-model"></div></div>
      <div class="card"><h3>按 Agent 汇总（累计输出）</h3><div id="by-agent"></div></div>
    </div>

    <div class="card"><h3>最近请求</h3><div id="recent-list"></div></div>`;

  renderHeat(U, U.keys);
  renderDayDetail(U);
  renderSpeed(recent);
  renderByModel(U, grand);

  renderRecent(recent);

  el.querySelector("#hm-modes").querySelectorAll("button").forEach(b=>b.onclick=()=>{ heatMode=b.dataset.m; renderUsage(s); });
}

function renderHeat(U, keys){
  const grid = $("#hm"); if(!grid) return; grid.innerHTML = "";
  let tip = document.getElementById("hm-tip");
  if(!tip){ tip = document.createElement("div"); tip.id = "hm-tip"; document.body.appendChild(tip); }
  tip.style.display = "none";
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end); start.setDate(start.getDate() - start.getDay() - 51*7);
  const p = n=>String(n).padStart(2,"0");
  const keyOf = d => `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const valOf = k => U.byDay[k] ? U.byDay[k].total : 0;

  // cells: [key, value, col]; tips: key -> {date, line} for the hover popup
  const cells = [], tips = {};
  let peak = 0;
  if(heatMode === "weekly"){
    for(let w=0; w<52; w++){
      let sum=0, reqs=0, firstKey=null, lastKey=null, lastDate=null;
      for(let j=0;j<7;j++){
        const d = new Date(start); d.setDate(start.getDate()+w*7+j);
        const key = keyOf(d), dv = U.byDay[key];
        sum += valOf(key); reqs += dv ? (dv.requests||0) : 0;
        if(j===0) firstKey = key;
        lastKey = key; lastDate = d;
      }
      cells.push([lastKey, sum, w]);
      tips[lastKey] = { date: firstKey.slice(5)+" ~ "+lastKey.slice(5), line: fmtK(sum)+" tok · "+reqs+" 次请求" };
      if(sum>peak) peak = sum;
    }
  } else {
    let acc = 0;
    const total = Math.round((end - start)/86400000) + 1;
    for(let i=0;i<total;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const key = keyOf(d), dv = U.byDay[key];
      const v = dv ? dv.total : 0;
      acc += v;
      const col = Math.floor(i/7);
      if(heatMode === "cumulative"){
        cells.push([key, acc, col]);
        tips[key] = { date: key+" · 累计", line: fmtK(acc)+" tok" };
        if(acc>peak) peak = acc;
      } else {
        cells.push([key, v, col]);
        tips[key] = { date: key, line: dv ? fmtK(v)+" tok · "+(dv.requests||0)+" 次请求"+(dv.failed?" · 失败 "+dv.failed:"") : "当天没有用量" };
        if(v>peak) peak = v;
      }
    }
  }
  const level = v => v<=0 ? 0 : Math.min(4, Math.max(1, Math.ceil(v/peak*4)));
  grid.classList.toggle("wk", heatMode==="weekly");
  for(const [key,v,col] of cells){
    const div = document.createElement("div");
    div.className = "hm-cell" + (v>0 ? " has hm-level"+level(v) : "");
    div.dataset.col = col;
    div.dataset.key = key;
    div.onclick = ()=>{ usageDay = usageDay===key ? null : key; renderUsage(STATE); };
    grid.appendChild(div);
  }
  const months = $("#hm-months"); if(months) months.innerHTML = "";
  // Month labels span WEEK COLUMNS, not day cells: the months grid has the
  // same 52 columns as the heatmap, and a month touches ~4-5 of them. Counting
  // days here would create 300+ implicit columns and stretch the labels row
  // far past the grid.
  const groups = [];
  for(const [key,,col] of cells){
    const m = new Date(key+"T00:00:00").getMonth();
    const g = groups[groups.length-1];
    if(g && g.m === m){ g.end = col; } else { groups.push({m, start: col, end: col}); }
  }
  for(let i=0;i<groups.length;i++){
    const g = groups[i];
    const end = (i+1 < groups.length) ? groups[i+1].start : 52;
    const span = Math.max(1, Math.min(52 - g.start, end - g.start));
    const s = document.createElement("span");
    s.style.gridColumn = "span "+span;
    s.textContent = (g.m+1)+"月";
    months.appendChild(s);
  }

  const showTip = (key, x, y) => {
    const t = tips[key];
    if(!t){ tip.style.display = "none"; return; }
    tip.innerHTML = '<div class="tt-date">'+t.date+'</div>'+esc(t.line);
    tip.style.display = "block";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lx = x + 12, ly = y - th - 10;
    if(lx + tw > window.innerWidth - 8) lx = x - tw - 12;
    if(ly < 8) ly = y + 16;
    tip.style.left = lx+"px"; tip.style.top = ly+"px";
  };
  grid.onmousemove = e => {
    const c = e.target.closest ? e.target.closest(".hm-cell") : null;
    if(c) showTip(c.dataset.key, e.clientX, e.clientY); else tip.style.display = "none";
  };
  grid.onmouseleave = () => { tip.style.display = "none"; };
}

function renderDayDetail(U){
  const box = $("#day-detail");
  if(!box) return;
  if(heatMode!=="daily"){ box.innerHTML = ""; return; }
  if(!usageDay || !U.byDay[usageDay]){
    box.innerHTML = '<div class="muted" style="font-size:12px">点某一天方块，看它当天用了多少。</div>';
    return;
  }
  const d = U.byDay[usageDay];
  const rows = Object.entries(d.models).sort((a,b)=>b[1]-a[1]);
  const peak = rows.length ? rows[0][1] : 0;
  let html = '<div class="dayhead"><b class="mono">'+usageDay+'</b>'+
    '<span class="muted" style="font-size:12px">'+d.requests+' 次请求 · '+d.failed+' 失败 · 输入 '+fmtN(d.input)+' · 输出 '+fmtN(d.output)+'</span>'+
    '<span class="x" data-x>×</span></div>';
  if(rows.length===0){ html += '<div class="muted" style="font-size:12px">当天没有成功产出 token。</div>'; }
  else {
    html += '<table>' + rows.map(([m,o])=>{
      return '<tr><td class="mono" style="font-size:11.5px">'+esc(m)+'</td>'+
        '<td style="width:38%"><div class="barwrap"><div class="bar" style="width:'+(peak?Math.round(o/peak*100):0)+'%"></div></div></td>'+
        '<td class="num">'+fmtN(o)+'</td></tr>';

  }
  box.innerHTML = html;

function renderSpeed(recent){
  const box = $("#speed");
  const streamed = recent.filter(r=>r.ok && (r.decodeMs||0) >= 250);
  const credible = streamed.filter(r=>r.output>0 && (r.output/(r.decodeMs/1000))<=250);
  const sumDecode = credible.reduce((a,r)=>a+r.decodeMs,0);
  const sumTok = credible.reduce((a,r)=>a+(r.decodeTok||0),0);
  const wTps = sumDecode>0 ? sumTok/(sumDecode/1000) : null;
  const ttfts = recent.filter(r=>r.ttftMs>0).map(r=>r.ttftMs);
  const avgTtft = ttfts.length ? Math.round(ttfts.reduce((a,b)=>a+b,0)/ttfts.length) : null;
  const outs = recent.map(r=>r.output||0);
  const avgOut = outs.length ? Math.round(outs.reduce((a,b)=>a+b,0)/outs.length) : null;
  const cell = (label, value, color) => {
    return '<div class="stat"><div class="v" style="color:'+color+'">'+value+'</div><div class="l">'+label+'</div></div>';
  };
  box.innerHTML =
    cell("加权输出速度", (wTps!==null&&credible.length>=2) ? wTps.toFixed(0)+" tok/s" : "—", SEASON[0]) +
    cell("平均首字", avgTtft!==null ? (avgTtft/1000).toFixed(1)+"s" : "—", SEASON[2]) +
    cell("平均输出 / 次", avgOut!==null ? fmtK(avgOut)+" tok" : "—", SEASON[3]) +
    cell("样本数", String(recent.length), "var(--ink-dim)");
}

    });

      const j = await api("/settings", { logLevel: on ? on.dataset.f : "debug", logKeepDays: keep });
      if(j){ logFilePick = ""; logKeepPick = ""; toast("日志设置已保存"); refresh(); }
    };

    const j = await fetch("/admin/api/logs" + logQuery());
    const data = await j.json();
    const view = el.querySelector("#log-view");
    if(!view) return;
    const days = data.days || [];
    const key = days.join(",");
    if(key !== logDaysKey){
      logDaysKey = key;
      logDays = days;
      if(logDay && days.indexOf(logDay) < 0) logDay = "";
      // 选栏按签名重建：日期列表会随文件轮转变化，值仍然落在容器上。
      makeDropdown(el.querySelector("#log-day"), logDayOptions(), logDay,
        v => { logDay = v; renderLogs(); });

    const lines = (data.entries||[]).map(e=>{
      const c = {INFO:"var(--ink-dim)",WARN:"var(--warn)",ERROR:"var(--bad)"}[e.level]||"var(--ink-dim)";

    }).join("");
    view.innerHTML = lines || '<span class="muted">暂无日志。</span>';
    el.querySelector("#log-count").textContent = (data.entries||[]).length + " 条"
      + (logDay ? "（来自 " + logDay + " 的文件）" : "");
    initSegs();
  } catch(e) {
    const view = el.querySelector("#log-view");
    if(view) view.innerHTML = '<span class="muted">加载失败。</span>';
  }
}

// logQuery is the filter the panel shows, so 下载 exports exactly what you see.
function logQuery(){
  const p = new URLSearchParams();
  if(logCat) p.set("cat", logCat);
  if(logLevel) p.set("level", logLevel);
  if(logDay) p.set("day", logDay);
  if(logQ) p.set("q", logQ);
  p.set("limit", "500");
  return "?"+p.toString();
}

function setToggle(sel, on){
  const b = document.querySelector(sel);
  b.textContent = on ? "已开启" : "关闭";
  b.classList.toggle("off", !on);
  b.dataset.on = on ? "1" : "";
}
