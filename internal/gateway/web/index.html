// 「来源」下拉的选项来自日志文件列表，每次渲染重新喂给选栏组件。
function logDayOptions(){
  return [["", "实时（内存）"]].concat(logDays.map(d => [d, d]));
}

async function renderLogs(){
  const el = $("#page-logs");
  if(!el) return;
  if(!el.dataset.init){
    el.innerHTML = '<h2 class="pt">日志 <span class="sub" id="log-sub">分类开关即时生效</span></h2>'
      + '<div class="card">'
      + '<div class="logrow" id="log-cats"></div>'
      + '<div class="logrow" style="margin-top:10px">'
      +   '<span class="k">显示</span>'
      +   '<div class="seg" id="log-levels">'
      +   [["","全部"],["debug","Debug"],["info","Info"],["warn","Warn"],["error","Error"]].map(([v,t])=>
          '<button data-l="'+v+'" class="'+(logLevel===v?"on":"")+'">'+t+'</button>').join("")
      +   '</div>'
      +   '<span class="dim" style="font-size:12px">来源</span>'
      +   '<div class="sel tight" id="log-day"></div>'
      +   '<span class="dim" style="font-size:12px">只看</span>'
      +   '<div class="sel tight" id="log-cat"></div>'
      +   '<input id="log-q" style="'+LOG_INP+';width:230px" placeholder="按请求 id 或关键字过滤">'
      +   '<button class="ghost" id="log-dl">下载</button>'
      +   '<span class="muted" style="font-size:11.5px" id="log-count"></span>'
      + '</div>'
      + '<div class="logrow" style="margin-top:10px">'
      +   '<span class="k">写入文件</span>'
      +   '<div class="seg" id="log-file-levels">'
      +   [["debug","Debug"],["info","Info"],["warn","Warn"],["error","Error"]].map(([v,t])=>
          '<button data-f="'+v+'">'+t+'</button>').join("")
      +   '</div>'
      +   '<label class="dim" style="font-size:12px">保留天数 <input type="number" id="log-keep" style="'+LOG_INP+';width:64px" min="1" max="365"></label>'
      +   '<button class="ghost" id="log-save">保存</button>'
      +   '<span class="muted" style="font-size:11.5px">「显示」只影响这一屏；「写入文件」决定日志文件里留下什么。</span>'
      + '</div>'
      + '<pre id="log-view" style="max-height:60vh; overflow:auto; margin-top:12px"></pre></div>';
    el.dataset.init = "1";
    el.querySelector("#log-levels").querySelectorAll("button").forEach(b=>b.onclick=()=>{
      logLevel=b.dataset.l;
      el.querySelectorAll("#log-levels button").forEach(x=>x.classList.toggle("on", x===b));
      renderLogs();
    });
    el.querySelector("#log-file-levels").querySelectorAll("button").forEach(b=>b.onclick=()=>{
      logFilePick = b.dataset.f;
      el.querySelectorAll("#log-file-levels button").forEach(x=>x.classList.toggle("on", x===b));
    });
    makeDropdown(el.querySelector("#log-cat"), [["", "全部分类"]].concat(LOG_CATS), logCat,
      v => { logCat = v; renderLogs(); });
    makeDropdown(el.querySelector("#log-day"), logDayOptions(), logDay,
      v => { logDay = v; renderLogs(); });
    const q = el.querySelector("#log-q");
    q.onchange = () => { logQ = q.value.trim(); renderLogs(); };
    q.onkeydown = e => { if(e.key==="Enter"){ logQ = q.value.trim(); renderLogs(); } };
    el.querySelector("#log-dl").onclick = () => { window.location.href = "/admin/api/logs/download" + logQuery(); };
    el.querySelector("#log-save").onclick = async () => {
      const on = el.querySelector("#log-file-levels button.on");
      const keep = parseInt(el.querySelector("#log-keep").value) || undefined;
      const j = await api("/settings", { logLevel: on ? on.dataset.f : "debug", logKeepDays: keep });
      if(j){ logFilePick = ""; logKeepPick = ""; toast("日志设置已保存"); refresh(); }
    };
  }

  const st = (STATE && STATE.settings) || {};
  const cats = st.logCategories || {};
  const box = el.querySelector("#log-cats");
  box.innerHTML = '<span class="k">记录</span>'
    + LOG_CATS.map(([k,label])=>'<button class="chip'+(cats[k]?" on":"")+'" data-c="'+k+'">'
        + '<span class="dotc" style="background:'+(cats[k]?"var(--accent)":"var(--ink-mute)")+'"></span>'+label
        + '</button>').join("")
    + '<span class="chip static">未分类信息 · 始终记录</span>';
  box.querySelectorAll(".chip[data-c]").forEach(b=>b.onclick=async ()=>{
    const next = {};
    LOG_CATS.forEach(([k])=>{ next[k] = !!cats[k]; });
    next[b.dataset.c] = !cats[b.dataset.c];
    const j = await api("/settings", { logCategories: next });
    if(j){ toast((next[b.dataset.c]?"已开始记录 ":"已停止记录 ")+b.textContent.trim()); refresh(); }
  });
  const keep = el.querySelector("#log-keep");
  if(document.activeElement !== keep) keep.value = logKeepPick || st.logKeepDays || "";
  keep.oninput = () => { logKeepPick = keep.value; };
  const fl = el.querySelector("#log-file-levels");
  const fileLevel = logFilePick || st.logLevel || "debug";
  fl.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.f===fileLevel));
  el.querySelector("#log-sub").textContent = "分类开关即时生效 · 文件保留 " + (st.logKeepDays||7) + " 天";
  initSegs();

  try {
    const j = await fetch("/admin/api/logs" + logQuery());
    const data = await j.json();
    const view = el.querySelector("#log-view");
    if(!view) return;
    const days = data.days || [];
    const key = days.join(",");
    if(key !== logDaysKey){
      logDaysKey = key;
      logDays = days;
      if(logDay && days.indexOf(logDay) < 0) logDay = "";
      // 选栏按签名重建：日期列表会随文件轮转变化，值仍然落在容器上。
      makeDropdown(el.querySelector("#log-day"), logDayOptions(), logDay,
        v => { logDay = v; renderLogs(); });
    }
    const lines = (data.entries||[]).map(e=>{
      const c = {INFO:"var(--ink-dim)",WARN:"var(--warn)",ERROR:"var(--bad)"}[e.level]||"var(--ink-dim)";
      return '<div style="color:'+c+'">['+String(e.at).slice(11,19)+'] ['+e.level+']'
        + (e.cat ? ' <span style="color:var(--ink-mute)">['+e.cat+']</span> ' : ' ') + esc(e.msg)+'</div>';
    }).join("");
    view.innerHTML = lines || '<span class="muted">暂无日志。</span>';
    el.querySelector("#log-count").textContent = (data.entries||[]).length + " 条"
      + (logDay ? "（来自 " + logDay + " 的文件）" : "");
    initSegs();
  } catch(e) {
    const view = el.querySelector("#log-view");
    if(view) view.innerHTML = '<span class="muted">加载失败。</span>';
  }
}

// logQuery is the filter the panel shows, so 下载 exports exactly what you see.
function logQuery(){
  const p = new URLSearchParams();
  if(logCat) p.set("cat", logCat);
  if(logLevel) p.set("level", logLevel);
  if(logDay) p.set("day", logDay);
  if(logQ) p.set("q", logQ);
  p.set("limit", "500");
  return "?"+p.toString();
}

let lastSig = "";
async function refresh(){
  if(stateRequest) return stateRequest;
  stateRequest = (async()=>{
    const j = await api("/state");
    if(!j){
      const dot = document.getElementById("svcdot");
      const stat = document.getElementById("svcstat");
      if(dot) dot.style.background = "var(--bad)";
      if(stat) stat.textContent = "连接失败";
      return null;
    }
    if(typeof j.uptimeSec === "number") bootAt = Date.now() - j.uptimeSec*1000;
    const sig = JSON.stringify([j.models,j.agents,j.stats,j.settings,j.egress,j.mainKey,j.baseURL,j.port,j.providers,j.subscriptions,j.announcements,j.announcementArchive]);
    if (sig === lastSig){ tickUptime(); return j; }
    lastSig = sig; STATE = j; render();
    return j;
  })().finally(()=>{ stateRequest = null; });
  return stateRequest;
}

/* ---- custom dropdown ---- */
/* 下拉选栏：一个按钮 + 一个 listbox 菜单。
   三件事是这里最容易悄悄坏掉的，都按“最后一次调用”处理：
   1. 选项变了必须重建菜单（同一容器常被喂进新的模型列表）；
   2. onChange 存成最新的那个闭包，否则第二次渲染后点选项会跑回调到旧数据上；
   3. 键盘可达：方向键移动、Enter 选中、Esc 关闭，菜单贴着窗口底部时向上开。 */
function makeDropdown(container, options, value, onChange){
  container.classList.add("sel");
  if(!container.querySelector(".sel-btn")){
    container.innerHTML = `<button type="button" class="sel-btn" aria-haspopup="listbox" aria-expanded="false">`
      + `<span class="sel-val"></span>`
      + `<svg class="arr" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      + `</button><div class="sel-menu" role="listbox"></div>`;
  }
  const val = container.querySelector(".sel-val");
  const btn = container.querySelector(".sel-btn");
  const menu = container.querySelector(".sel-menu");
  // 最新的回调存在容器上：菜单只在选项变化时重建，点击时永远读这里。
  container.__change = onChange;
  const label = v => { const o = options.find(x=>x[0]===v); return o ? o[1] : v; };
  const sig = options.map(o=>o[0]+"\u0000"+o[1]).join("\u0001");
  if(menu.dataset.sig !== sig){
    // 每个选栏一套稳定的 option id，供 aria-activedescendant 指向；
    // 容器没有 id 时也要拿到一个，不能生成以 "-" 开头的非法值。
    if(!container.id) container.id = "sel-" + (makeDropdown.seq++);
    const pid = container.id;
    menu.innerHTML = options.map(([v,t], i)=>
      `<div class="opt" role="option" tabindex="-1" id="${pid}-o${i}" data-v="${esc(String(v))}">`
      + `<span>${esc(t)}</span>`
      + `<svg class="okm" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6 9.5 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      + `</div>`).join("");
    menu.dataset.sig = sig;
    menu.querySelectorAll(".opt").forEach(o=>{
      o.onclick = () => pick(o.dataset.v);
      o.onmouseenter = () => move(opts(), o);
    });
  }
  function set(v){
    container.dataset.value = v;
    val.textContent = label(v);
    menu.querySelectorAll(".opt").forEach(o=>{
      const on = o.dataset.v === v;
      o.classList.toggle("on", on);
      o.setAttribute("aria-selected", on ? "true" : "false");
    });
  }
  function pick(v){
    set(v);
    close();
    if(container.__change) container.__change(v);
  }
  set(value);
  const opts = () => Array.from(menu.querySelectorAll(".opt"));

  function move(list, target){
    if(!list.length) return;
    let i = target === null ? list.findIndex(o=>o.classList.contains("on"))
                             : list.indexOf(target);
    if(i < 0) i = 0;
    list.forEach(o=>o.classList.remove("cursor"));
    list[i].classList.add("cursor");
    btn.setAttribute("aria-activedescendant", list[i].id);
    list[i].scrollIntoView({block:"nearest"});
  }

  function open(){
    document.querySelectorAll(".sel.open").forEach(x=>{ if(x!==container) x.classList.remove("open"); });
    // 向下放不下就向上开：设置页和供应商卡的选栏常贴着窗口底部。
    const r = btn.getBoundingClientRect();
    const roomBelow = window.innerHeight - r.bottom;
    container.classList.toggle("up", roomBelow < Math.min(320, (r.height + 8) * 6) && roomBelow < r.top);
    container.classList.add("open");
    btn.setAttribute("aria-expanded","true");
    move(opts(), null);
    document.addEventListener("click", outside);
  }
  function close(){
    container.classList.remove("open");
    container.__pressIn = false;
    btn.setAttribute("aria-expanded","false");
    btn.removeAttribute("aria-activedescendant");
    document.removeEventListener("click", outside);
  }
  const outside = e => { if(!container.contains(e.target)) close(); };

  btn.onclick = e => {
    e.stopPropagation();
    if(container.classList.contains("open")) close(); else open();
  };
  btn.onkeydown = e => {
    const list = opts();
    const isOpen = container.classList.contains("open");
    if(!isOpen && (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Enter" || e.key === " ")) {
      e.preventDefault(); open(); return;
    }
    if(!isOpen) return;
    const i = list.findIndex(o=>o.classList.contains("cursor"));
    if(e.key === "Escape"){ e.preventDefault(); close(); btn.focus(); }
    else if(e.key === "Tab"){ close(); }
    else if(e.key === "ArrowDown"){ e.preventDefault(); move(list, list[Math.min(i+1, list.length-1)]); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); move(list, list[Math.max(i-1, 0)]); }
    else if(e.key === "Home"){ e.preventDefault(); move(list, list[0]); }
    else if(e.key === "End"){ e.preventDefault(); move(list, list[list.length-1]); }
    else if(e.key === "Enter" || e.key === " "){ e.preventDefault(); if(list[i]) pick(list[i].dataset.v); }
  };
  // 鼠标按下选项时按钮先失焦：如果这时就关闭菜单，menu 立刻 display:none，
  // mouseup/click 落在空白处，用鼠标点选项就永远不会生效（键盘路径反而正常）。
  // 所以“按进了菜单里”的那次失焦不关；选项也带 tabindex=-1，点它焦点仍留在容器内。
  if(!menu.dataset.pressBound){
    menu.dataset.pressBound = "1";
    menu.addEventListener("mousedown", () => { container.__pressIn = true; });
  }
  btn.onblur = () => {
    if(container.__pressIn){ container.__pressIn = false; return; }
    if(!container.contains(document.activeElement)) close();
  };
}
makeDropdown.seq = 1;

const wbtn = id => document.getElementById(id);
wbtn("w-min").onclick = e => { e.stopPropagation(); window.zengateMinimize && zengateMinimize(); };
wbtn("w-max").onclick = e => { e.stopPropagation(); window.zengateToggleMax && zengateToggleMax(); };
wbtn("w-close").onclick = e => { e.stopPropagation(); window.zengateClose && zengateClose(); };
const tb = document.getElementById("titlebar");
let dragArmed = false, dragX = 0, dragY = 0;
tb.addEventListener("mousedown", e => {
  if (e.button !== 0 || e.target.closest("button")) return;
  dragArmed = true; dragX = e.screenX; dragY = e.screenY;
});
window.addEventListener("mousemove", e => {
  if (!dragArmed) return;
  if (!(e.buttons & 1)) { dragArmed = false; return; }
  if (Math.abs(e.screenX - dragX) + Math.abs(e.screenY - dragY) > 4) {
    dragArmed = false;
    window.zengateDrag && zengateDrag();
  }
});
window.addEventListener("mouseup", () => { dragArmed = false; });
tb.addEventListener("dblclick", e => {
  if (e.target.closest("button")) return;
  window.zengateToggleMax && zengateToggleMax();
});

nav(); render(); refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
