name: release

on:
  push:
    tags: ["v*"]
  # PRs get the build gate on every pull request, no path filter: master
  # requires these checks, and a filtered trigger would strand a docs-only PR
  # with no statuses to satisfy. Releases still only happen on tags: the
  # publish step below is gated on the ref, and a fork PR's token is read-only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v','' -replace '/','-'
          go build -trimpath -ldflags "-s -w -H=windowsgui -X zen-gate/internal/gateway.Version=$ver -X zen-gate/internal/update.Current=$ver" -o dist/zen-gate.exe ./cmd/zen-gate
          go build -trimpath -ldflags "-s -w" -o dist/zenstats.exe ./cmd/zenstats

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v','' -replace '/','-'
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          if (-not (Test-Path dist/zen-gate.exe)) { throw "zen-gate.exe missing" }
          tar -a -c -f "dist/zen-gate-$ver.zip" -C dist zen-gate.exe README.md LICENSE
          Get-ChildItem dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/zen-gate.exe dist/zenstats.exe dist/*.zip --title "${{ github.ref_name }}" --generate-notes --latest

  # The Linux port ships for real: the AppImage bundles GTK3 plus
  # libayatana-appindicator, the .deb depends on the distro's libraries. The
  # job also doubles as the PR build gate for the linux-tagged files — the
  # Windows and macOS runners never compile those.
  build-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build AppImage
        run: tools/build-linux.sh "${GITHUB_REF_NAME#v}"

      - name: Build .deb
        run: tools/build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.AppImage dist/*.deb --clobber

  # The macOS port builds here but is not published: the bundle is only
  # ad-hoc signed, and shipping that would hand every user a Gatekeeper warning
  # until there is a Developer ID to notarize against. This job is the build
  # gate — it fails the tag when the Objective-C window layer or the universal
  # lipo step breaks. Publish the artifact below by hand, or add signing first.
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The darwin-only tests (launchd autostart, scutil proxy parsing, the
      # macOS data dir) have no other place to run.
      - name: Test
        run: go test ./...

      - name: Build
        run: tools/build-macos.sh "${GITHUB_REF_NAME#v}" | tr '/' '-'

      - name: Verify
        run: |
          lipo -info "dist/Zen Gate.app/Contents/MacOS/zen-gate"
          codesign --verify --deep --strict "dist/Zen Gate.app"
          plutil -lint "dist/Zen Gate.app/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: zen-gate-macos
          path: |
            dist/Zen Gate.app
            dist/zen-gate-darwin
            dist/zen-gate-*-darwin.zip
          if-no-files-found: error
